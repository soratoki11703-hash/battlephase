<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>バトルフェーズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- 文字のフォントは読み込みを待たずに画面を出す（電波が弱くても起動が止まらないように）。読めたら差し替わる -->
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #1b1530;
    --ink: #fff;
    --panel: rgba(22, 18, 40, 0.88);
    --line: rgba(255, 255, 255, 0.14);
    --p1: #ff4d6d;
    --p2: #3fa9ff;
    --gold: #ffd23f;
    --muted: #b9b2d6;
    --shade: rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: var(--bg); color: var(--ink);
    font-family: "M PLUS Rounded 1c", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; }
  button { touch-action: manipulation; }
  button { font-family: inherit; cursor: pointer; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: flex; }

  /* タイトル */
  /* 上にロゴ、真ん中は3Dのキャラが見えるように空け、下にメニューをまとめる */
  #title { flex-direction: column; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none; overflow-y: auto;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .ttop { text-align: center; margin-top: 7vh; }   /* ロゴは画面のふちから少し下げる */
  .ttop .sub { margin: 18px 0 0; }
  .tmenu { display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(380px, 100%); }
  .tmain { width: 100%; min-width: 0; }
  .big-btn small { display: block; font-family: system-ui, sans-serif; font-weight: 800; font-size: 12px; opacity: .85; margin-top: 2px; }
  .big-btn small:empty { display: none; }
  /* 広告を見て復活：結果画面でいちばん大きく、ゆっくり脈打たせる */
  #reviveBtn { font-size: 28px; padding: 20px 36px; min-width: 330px; border-radius: 22px; background: linear-gradient(180deg, #a77bff, #7c3aed);
    box-shadow: 0 7px 0 rgba(0,0,0,.35), 0 0 28px rgba(167,123,255,.7); animation: revivePulse 1.2s ease-in-out infinite; }
  #reviveBtn small { font-size: 14px; margin-top: 4px; }
  @keyframes revivePulse { 50% { transform: scale(1.05); box-shadow: 0 7px 0 rgba(0,0,0,.35), 0 0 44px rgba(167,123,255,.95); } }
  #appBtn small { display: block; font-size: 13px; opacity: .9; margin-top: 2px; }
  @media (max-height: 500px) { #reviveBtn { font-size: 20px; padding: 10px 26px; } #reviveBtn small { font-size: 11px; } }
  #fakeAd { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #000; color: #fff; font-size: 26px; font-weight: 800; }
  #fakeAd[hidden] { display: none; }
  .big-btn.tsub { font-size: 17px; padding: 11px 20px; }
  .trow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .trow .big-btn { min-width: 0; padding: 11px 6px; white-space: nowrap; }
  .trow .big-btn[hidden] { display: none; }
  .trow:has(> [hidden]) { grid-template-columns: 1fr; }
  .pr-opts { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .pr-opts .cpu-lv { flex-wrap: wrap; padding: 8px 10px; }
  .pr-opts .cpu-lv .lb { width: 100%; margin: 0 0 2px 2px; }
  .tgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 6px; width: 100%; }
  .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; padding: 10px 4px 8px; border: none; border-radius: 16px;
    background: rgba(27, 21, 48, .8); color: #fff; font-weight: 800; font-size: 12px; white-space: nowrap; box-shadow: 0 4px 0 rgba(0,0,0,.3); transition: transform .08s; }
  .tile b { font-size: 24px; line-height: 1.15; }
  .tile small { font-size: 10px; color: var(--gold); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile small:empty { display: none; }
  .tile:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .tile[hidden] { display: none; }
  .dev-only { display: none !important; }
  /* 広告なしプラン */
  .na-feat { margin: 0; padding-left: 1.3em; font-size: 15px; line-height: 1.8; }
  .na-price { font-family: "Mochiy Pop One", sans-serif; font-size: 26px; color: var(--gold); text-align: center; margin: 4px 0 0; }
  .na-legal { font-size: 11px !important; opacity: .75; line-height: 1.6 !important; }
  .na-legal a { color: inherit; }
  #noAdsLink { margin-top: -4px; }
  .ping { font-size: 11px; font-weight: 800; color: #b8f5c8; text-shadow: 0 1px 3px rgba(0,0,0,.7); white-space: nowrap; }
  .ping.mid2 { color: #ffe08a; } .ping.bad { color: #ff9a8a; }
  /* 撮影モード：動画に要らない表示を隠す */
  html.shoot :is(#pauseBtn, .ctrl, #toast, #result .row, #result button, #tut) { display: none !important; }
  html.shoot-nohud :is(#hud .bar, #hud .pl, #hud .hud-sub) { visibility: hidden !important; }
  body.dev .dev-only { display: flex !important; }   /* 観戦は開発用（?dev を付けたときだけ） */
  #title > * { pointer-events: auto; }
  .logo { font-family: "Mochiy Pop One", sans-serif; font-size: clamp(44px, 9vw, 110px); line-height: 1; letter-spacing: 2px;
    color: var(--gold); text-shadow: 0 6px 0 #c2410c, 0 12px 30px rgba(0,0,0,.5); transform: rotate(-3deg); margin: 0; }
  .sub { font-weight: 800; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.7); margin: 0 0 14px; font-size: 18px; }
  .big-btn { font-family: "Mochiy Pop One", sans-serif; font-size: 22px; padding: 16px 34px; min-width: 300px; border: none; border-radius: 18px;
    color: #fff; background: var(--p1); box-shadow: 0 6px 0 rgba(0,0,0,.35); transition: transform .08s; }
  .big-btn:hover { transform: translateY(-2px) scale(1.03); }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .big-btn.blue { background: var(--p2); }
  .big-btn.gold { background: var(--gold); color: #3b2300; }
  .big-btn.ghost { background: rgba(27, 21, 48, .72); }
  .big-btn.purple { background: #8a5cff; }
  .cpu-lv { display: flex; align-items: center; gap: 4px; background: rgba(27, 21, 48, .72); padding: 4px 6px 4px 12px; border-radius: 14px; font-weight: 800; font-size: 13px; }
  .cpu-lv .lb { color: var(--muted); font-size: 12px; margin-right: 4px; white-space: nowrap; }
  .cpu-lv .opt { padding: 5px 10px; font-size: 13px; white-space: nowrap; }
  .win-sub { font-weight: 800; font-size: 16px; color: #fff; text-shadow: 0 2px 6px #000; min-height: 1.2em; }
  .hint { color: var(--ink); font-size: 13px; text-align: center; line-height: 1.7; background: rgba(27, 21, 48, .72); padding: 8px 14px; border-radius: 12px; margin: 4px 16px 0; }

  /* クリエイター */
  #create { pointer-events: none; }
  .panel { pointer-events: auto; width: 430px; max-width: 100%; height: 100%; overflow-y: auto; background: var(--panel);
    backdrop-filter: blur(8px); border-right: 1px solid var(--line);
    padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(120px + env(safe-area-inset-bottom, 0px)) calc(18px + env(safe-area-inset-left, 0px)); }
  .ph { display: flex; align-items: center; gap: 10px; font-family: "Mochiy Pop One", sans-serif; font-size: 22px; margin-bottom: 12px; }
  .badge { font-size: 15px; padding: 4px 10px; border-radius: 10px; background: var(--p1); }
  .badge.p2 { background: var(--p2); }
  .row { display: flex; gap: 8px; align-items: center; }
  .name-in { flex: 1; font: 800 20px "M PLUS Rounded 1c"; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line);
    background: rgba(0,0,0,.3); color: #fff; outline: none; min-width: 0; }
  .name-in:focus { border-color: var(--gold); }
  .sq { width: 46px; height: 46px; border-radius: 12px; border: none; background: rgba(255,255,255,.12); color: #fff; font-size: 22px; flex: none; }
  h3 { margin: 18px 0 6px; font-size: 13px; color: var(--gold); letter-spacing: 1px; }
  h2.sec { margin: 22px 0 4px; font-family: "Mochiy Pop One"; font-size: 17px; border-top: 1px dashed var(--line); padding-top: 14px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { border: 2px solid transparent; background: rgba(255,255,255,.09); color: #fff; padding: 7px 11px; border-radius: 10px; font-weight: 800; font-size: 14px; }
  .opt:hover { background: rgba(255,255,255,.18); }
  .opt.sel { border-color: var(--gold); background: rgba(255,210,63,.18); }
  .opts.vis { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; }
  .opt.card { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px 7px; border-radius: 14px; min-width: 0; }
  .opt.card img, .opt.card .ico { width: 64px; height: 64px; display: block; }
  .opt.card img[src=""] { visibility: hidden; }
  .opt.card .ico { display: grid; place-items: center; font-size: 34px; border-radius: 50%; }
  .opt.card span { font-size: 12px; line-height: 1.2; text-align: center; }
  details.look { margin-top: 22px; border-top: 1px dashed var(--line); padding-top: 14px; }
  details.look summary { font-family: "Mochiy Pop One", sans-serif; font-size: 16px; cursor: pointer; list-style: none; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.08); }
  details.look summary::-webkit-details-marker { display: none; }
  details.look[open] summary { background: rgba(255,210,63,.18); }
  .mode-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .mode-tabs[hidden] { display: none; }
  .mode-tabs .opt { padding: 10px 6px; font-size: 14px; }
  .padwrap { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .padwrap[hidden] { display: none; }
  #pad { width: 100%; max-width: 320px; aspect-ratio: 1; border-radius: 14px; touch-action: none; cursor: crosshair; display: block;
    background-color: #f4f1fa; background-image: linear-gradient(#e2dcef 1px, transparent 1px), linear-gradient(90deg, #e2dcef 1px, transparent 1px);
    background-size: 32px 32px; border: 2px solid var(--line); }
  .pal { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pal button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
  .pal button.sel { border-color: var(--gold); }
  .pal input[type=color] { width: 34px; height: 30px; }
  .ptools { display: flex; flex-wrap: wrap; gap: 6px; }
  .ptools .tool.sel { background: rgba(255,210,63,.3); outline: 2px solid var(--gold); }
  .slider { display: grid; grid-template-columns: 92px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; font-weight: 800; margin-top: 8px; }
  .slider output { text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); }
  .slider input:disabled { opacity: .35; }
  .pts { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .pt-row { display: grid; grid-template-columns: 96px 32px 1fr 32px; gap: 8px; align-items: center; }
  .pt-row .lb { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .pt-row button.pm { width: 32px; height: 32px; border-radius: 10px; border: none; background: rgba(255,255,255,.12); color: var(--ink); font-size: 18px; font-weight: 800; }
  .pt-row button.pm:disabled { opacity: .3; }
  .pips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
  .pips i { height: 18px; border-radius: 4px; background: rgba(255,255,255,.1); cursor: pointer; }
  .pips i.on { background: linear-gradient(180deg, #ffd23f, #ff8a3d); }
  .pt-left { font-size: 14px; color: var(--gold); margin-left: 8px; }
  .pt-left.zero { color: var(--muted); }
  .desc { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 1.2em; }
  .colors { display: flex; gap: 14px; flex-wrap: wrap; }
  .colors label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; }
  input[type=color] { width: 42px; height: 32px; border: none; border-radius: 8px; background: none; padding: 0; cursor: pointer; }
  input[type=range] { width: 100%; accent-color: var(--gold); }
  .stats { margin-top: 10px; display: grid; grid-template-columns: 80px 1fr; gap: 6px 10px; align-items: center; font-size: 13px; font-weight: 800; }
  .bar { height: 10px; background: rgba(255,255,255,.1); border-radius: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #ffd23f, #ff6b35); border-radius: 6px; transition: width .2s; }
  .roster { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 4px 5px 10px; border-radius: 20px; background: rgba(255,255,255,.1);
    border: none; color: #fff; font-weight: 800; font-size: 13px; }
  .chip i { font-style: normal; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.3); font-size: 11px; }
  .chip .dot { width: 12px; height: 12px; border-radius: 50%; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tool { border: none; background: rgba(255,255,255,.12); color: #fff; padding: 8px 12px; border-radius: 10px; font-weight: 800; font-size: 13px; }
  .tool:hover { background: rgba(255,255,255,.22); }
  /* キャラ作成の性能カード（格闘ゲームのキャラ選択のように、選んだものの特徴をキャラの横に出す） */
  #charCard { position: fixed; top: 24px; right: 24px; width: 290px; max-height: calc(100% - 120px); overflow-y: auto; pointer-events: none; z-index: 3;
    background: linear-gradient(160deg, rgba(27, 21, 48, .9), rgba(60, 40, 110, .82)); border: 2px solid rgba(255, 210, 63, .55); border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  #charCard .cc-head { display: flex; align-items: baseline; gap: 8px; }
  #charCard .cc-name { font-family: "Mochiy Pop One", sans-serif; font-size: 22px; color: var(--gold); text-shadow: 0 2px 0 #c2410c; white-space: nowrap; }
  #charCard .cc-tag { font-size: 12px; color: var(--muted); font-weight: 800; }
  #charCard .cc-desc { font-size: 12px; line-height: 1.5; margin: 6px 0 8px; font-weight: 800; }
  #charCard .cc-st { display: grid; grid-template-columns: 70px 1fr; gap: 3px 8px; align-items: center; font-size: 12px; font-weight: 800; }
  #charCard .pips { display: flex; gap: 3px; }
  #charCard .pips i { flex: 1; height: 10px; border-radius: 3px; background: rgba(255,255,255,.12); transition: background .25s; }
  #charCard .pips i.on { background: linear-gradient(90deg, #ffd23f, #ff8a3d); }
  #charCard .pips em { font-style: normal; font-size: 10px; color: var(--gold); margin-left: 4px; white-space: nowrap; }
  #charCard .cc-line { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; font-size: 12px; line-height: 1.45; font-weight: 800; border-top: 1px dashed rgba(255,255,255,.18); padding-top: 7px; }
  #charCard .cc-line b { font-size: 18px; line-height: 1; }
  #charCard .cc-line small { display: block; color: var(--muted); font-size: 11px; }
  #charCard .new { animation: ccIn .45s ease-out; }
  #charCard small.sm { display: none; }
  @keyframes ccIn { from { opacity: 0; transform: translateX(-12px); background: rgba(255,210,63,.35); } to { opacity: 1; transform: none; background: transparent; } }
  @media (prefers-reduced-motion: reduce) { #charCard .new { animation: none; } }
  .go-bar { position: fixed; right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; pointer-events: auto; }
  .go-bar .big-btn { min-width: 0; }

  /* HUD */
  #hud { pointer-events: none; flex-direction: column; }
  .hud-top { display: flex; justify-content: space-between; gap: 20px;
    padding: calc(14px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) 14px calc(18px + env(safe-area-inset-left, 0px)); }
  .pl { width: min(40vw, 420px); }
  .pl.r { text-align: right; }
  .hud-sub { display: flex; justify-content: space-between; padding: 0 20px; margin-top: 2px; }
  .hud-sub[hidden] { display: none; }
  #hud.many .pl .nm { font-size: 15px; }
  #hud.many .pl .hp { height: 12px; }
  #hud.many .pl .meta { margin-top: 3px; font-size: 11px; }
  .pl.down { opacity: .35; }
  #onLobby { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #onLobby[hidden] { display: none; }
  .lobby { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .lobby .pc { padding: 8px 12px; border-radius: 12px; background: rgba(27, 21, 48, .85); font-weight: 800; font-size: 14px; border-bottom: 4px solid; }
  .lobby .pc.cpu { opacity: .6; }
  .cpu-lv .opt:disabled { opacity: .35; }
  #onStart:disabled { opacity: .45; }
  .pl .nm { font-family: "Mochiy Pop One"; font-size: 20px; text-shadow: 0 2px 6px #000; display: flex; gap: 8px; align-items: center; }
  .pl.r .nm { flex-direction: row-reverse; }
  .hp { position: relative; height: 20px; border-radius: 10px; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.8); overflow: hidden; margin-top: 6px; }
  .hp .lag, .hp .cur { position: absolute; top: 0; bottom: 0; left: 0; }
  .pl.r .hp .lag, .pl.r .hp .cur { left: auto; right: 0; }
  .hp .lag { background: #fff; }
  .gb { height: 6px; margin-top: 4px; border-radius: 3px; background: rgba(0,0,0,.45); overflow: hidden; }
  .gb i { display: block; height: 100%; background: #9fd8ff; border-radius: 3px; }
  .pl.r .gb i { margin-left: auto; }
  .gb i.low { background: #ff6b6b; }
  .hp .cur { background: linear-gradient(90deg, #4ade80, #a3e635); }
  .hp .cur.low { background: linear-gradient(90deg, #ef4444, #f97316); }
  .pl .meta { margin-top: 6px; display: flex; gap: 10px; font-size: 13px; font-weight: 800; text-shadow: 0 1px 4px #000; align-items: center; }
  .pl.r .meta { flex-direction: row-reverse; }
  .spg { position: relative; display: inline-block; min-width: 104px; height: 24px; border-radius: 12px; overflow: hidden;
    background: rgba(0,0,0,.5); border: 2px solid rgba(255,255,255,.45); }
  .spg i { position: absolute; top: 0; bottom: 0; left: 0; background: linear-gradient(90deg, #ff9f1c, #ffd23f); }
  .pl.r .spg i { left: auto; right: 0; }
  .spg b { position: relative; display: block; padding: 0 10px; line-height: 20px; font-size: 12px; color: #fff; text-shadow: 0 1px 2px #000; text-align: center; white-space: nowrap; }
  .spg.ready { border-color: #fff3b0; animation: spglow .7s ease-in-out infinite alternate; }
  .spg.ready b { color: #3b2300; text-shadow: none; }
  @keyframes spglow { from { box-shadow: 0 0 4px #ffd23f; } to { box-shadow: 0 0 16px #ffd23f, 0 0 4px #fff; } }
  .stars { color: var(--gold); letter-spacing: 2px; font-size: 18px; }
  .rnd { font-family: "Mochiy Pop One"; font-size: 18px; text-shadow: 0 2px 6px #000; padding-top: 6px; white-space: nowrap; }
  .ctrl { position: fixed; bottom: 10px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 18px;
    font-size: 12px; color: rgba(255,255,255,.75); text-shadow: 0 1px 3px #000; font-weight: 800; }
  #announce { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #announce span { font-family: "Mochiy Pop One"; font-size: clamp(50px, 11vw, 140px); color: var(--gold);
    text-shadow: 0 6px 0 #c2410c, 0 10px 40px rgba(0,0,0,.6); animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(2.2) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(-3deg); opacity: 1; } }
  /* ラウンドを取ったときの星（2本先取なら☆☆が出て、取った分がキラーンと埋まる） */
  #roundStars { position: fixed; left: 0; right: 0; top: 64%; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; z-index: 6; }
  #roundStars[hidden] { display: none; }
  #roundStars .rs-name { font-family: "Mochiy Pop One", sans-serif; font-size: 18px; text-shadow: 0 2px 6px #000; animation: rsIn .3s ease-out both; }

const SKILL_COST = { dash: 40, shot: 25, shield: 75, heal: 45, quake: 18, blink: 20 };
// 属性のおまけ効果（どれも「無属性のダメージ+15%」と同じくらいの価値になるよう CPU 総当たりで調整）
const ELEM_FX = { burn: 2, burnDps: 1.472, poison: 5, poisonDps: 1.327, slow: 3.881, stun: 0.125, noneBonus: 1.164, windKnock: 1.335 };

const NAME_A = ['ゴン','ピコ','ザン','モチ','ガル','ポン','キラ','ドド','メカ','ニャ','ボル','ルル','ジン','タコ','ベア','ズン','プリ','ギガ','チョコ','バク'];
const NAME_B = ['','丸','ン','X','太郎','マン','ゴン','すけ','キング','ちゃん','ZERO','ボーイ','ドン'];
const pick = a => a[Math.floor(Math.random() * a.length)];
const randName = () => pick(NAME_A) + pick(NAME_B);
const randColor = () => '#' + new THREE.Color().setHSL(Math.random(), 0.55 + Math.random() * 0.35, 0.45 + Math.random() * 0.2).getHexString();

function randomBuild() {
  const b = { name: randName(), size: 1,
              color: randColor(), accent: randColor(), wColor: randColor() };
  for (const k of Object.keys(OPTS)) b[k] = pick(OPTS[k])[0];
  const r = (lo, hi) => +(lo + Math.round(Math.random() * (hi - lo) / 0.05) * 0.05).toFixed(2);
  b.gripLen = r(0.2, 1.3); b.bladeLen = r(0.6, 1.6); b.bladeW = r(0.6, 1.6);
  b.pts = Object.fromEntries(PT_KEYS.map(([k]) => [k, PT_MIN]));
  for (let left = PT_TOTAL - PT_MIN * PT_KEYS.length; left > 0;) {
    const k = pick(PT_KEYS)[0];
    if (b.pts[k] < PT_MAX) { b.pts[k]++; left--; }
  }
  return b;
}
// 勝ち抜きの相手：その階層に合った属性・色あい・体・帽子・目・名前
function stageBuild(no, boss = false) {   // boss＝階層の おに（必殺技を使う）
  const stg = STAGES[no], b = randomBuild();
  if (stg.elem) b.element = pick(stg.elem);
  if (stg.hue) {
    const [a, c] = stg.hue, h = (a + Math.random() * (((c - a) % 1 + 1) % 1)) % 1;
    const hsl = (sat, l) => '#' + new THREE.Color().setHSL(h + (Math.random() - 0.5) * 0.04, sat, l).getHexString();
    const [s0, s1, l0, l1] = stg.tone || [0.6, 0.9, 0.45, 0.6];
    b.color = hsl(s0 + Math.random() * (s1 - s0), l0 + Math.random() * (l1 - l0)); b.accent = hsl(0.7, 0.25 + Math.random() * 0.15);
  }
  if (stg.foe) {
    const F = stg.foe;
    b.body = pick(F.body); b.hat = pick(F.hat); b.eyes = pick(F.eyes); b.name = pick(F.name) + pick(NAME_B);
    if (F.head) b.head = pick(F.head);
  }
  // 階層の必殺技は おにだけ（1階層目には決まった技がないので、どれか1つ）。skill はゲージのたまり方（SKILL_COST）だけに使う
  if (boss) { b.special = stg.foe?.special || pick(Object.keys(SPECIALS)); b.skill = 'shot'; }
  return b;
}
function defaultBuild(i) {
  return { name: i ? 'ブルー' : 'レッド', body: 'cube', head: 'ball', eyes: 'normal', hat: 'horns', size: 1, bsize: 'M',
           color: i ? '#3fa9ff' : '#ff4d6d', accent: '#2b2540', wHead: 'sword', element: 'fire',
           wColor: '#e5e7eb', skill: 'dash', gripLen: 0.55, bladeLen: 1, bladeW: 1, pts: defaultPts() };
}

function getStats(b) {
  const Z = SIZE[b.bsize] || SIZE.M, s = Z.s;   // HPは大きさに関係なく全員100
  const st = { hp: BASE.hp, speed: 6.2 * Z.spd, def: 1, knockRes: Z.wt, jump: 10.5 * Z.jump, radius: 0.55 * sizeOf(b) };

  // 能力ポイント（5が標準＝×1.0、10で×1.3、1で×0.76）
  const P = defaultPts();   // 能力ポイントは廃止（全員同じ）
  const m = k => 0.7 + P[k] * 0.06;
  st.hp = Math.round(st.hp * m('hp'));
  st.def *= 2 - m('def');
  st.speed *= m('spd');
  st.jump *= 0.85 + P.jmp * 0.03;
  st.knockRes *= m('wt');
  st.guardMax = 60 + P.def * 8;
  // 武器：形から性能を計算（大きく重いほど強いが遅い）
  const w = { ...WEAPONS[b.wHead], type: b.wHead };
  // 武器の形スライダーは見た目だけ。性能は武器の種類で決まる
  const grip = 0.55, heavy = 1;
  w.dmg *= (0.7 + 0.3 * heavy) * m('pow') * Z.pow;
  w.knock *= 0.7 + 0.3 * heavy;
  const slow = 0.75 + 0.25 * heavy + Math.max(0, grip - 0.55) * 0.3;
  w.wind *= slow * Z.swing; w.recover *= slow * Z.swing;   // 小さいほど振りが速い
  w.reach = Math.max(0.9, w.reach);   // リーチは大きさに関係なく同じ   // 武器の形スライダーは見た目だけ（リーチも変わらない）
  w.projSpeed = 16 + grip * 7;
  w.projR = 0.22 * Math.sqrt(heavy);
  // バランス：移動速度は武器ごとの計算値（攻撃力が高いほど遅い）
  st.speed *= w.move;
  // 3段コンボの各段のダメージ：武器の威力 × COMBO.steps（威力・属性・大きさがコンボにも効く）
  // やられっぱなしで受けるダメージは COMBO.cap まで（applyHit で制限）。ハンマーはコンボなし＝1発で吹っ飛ばす
  w.chainDmg = COMBO.steps.map(k => w.dmg * k);
  w.chainSteps = COMBO.on && w.type !== 'hammer' ? 3 : 1;
  st.weapon = w;
  st.element = b.element;
  st.skill = b.skill;
  return st;
}

function mat(color, extra = {}) { return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.05, ...extra }); }
const BLACK = mat(0x111111), WHITE = mat(0xffffff, { roughness: 0.3 });
const GOLD = mat(0xffcc33, { metalness: 0.7, roughness: 0.3 });
// 消したキャラ・弾・演出の形と材料を GPU から捨てる（捨てないと遊ぶほどメモリが増え、iPhone では画面が落ちてタイトルに戻る。2026-10-21）
//   KEEP_GPU に入れたもの（いくつもの物で使い回している形・材料・絵）は捨てない
const KEEP_GPU = new Set([BLACK, WHITE, GOLD]);
function disposeDeep(o) {
  o.traverse(m => {
    if (m.geometry && !KEEP_GPU.has(m.geometry)) m.geometry.dispose();
    for (const mt of [].concat(m.material || [])) {
      if (KEEP_GPU.has(mt)) continue;
      if (mt.map && !KEEP_GPU.has(mt.map)) mt.map.dispose();
      mt.dispose();
    }
    if (m.customDepthMaterial) m.customDepthMaterial.dispose();
  });
}

function shadowAll(o) { o.traverse(m => { if (m.isMesh) { m.castShadow = true; } }); }

function addEyes(parent, y, z, type, accent) {
  const g = new THREE.Group(); g.position.set(0, y, z); parent.add(g);
  const eye = (x, r) => {
    const w = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), WHITE); w.position.set(x, 0, 0); w.scale.z = 0.6; g.add(w);
    const p = new THREE.Mesh(new THREE.SphereGeometry(r * 0.5, 12, 10), BLACK); p.position.set(x, 0, r * 0.55); g.add(p);
  };
  if (type === 'normal' || type === 'angry') { eye(-0.15, 0.11); eye(0.15, 0.11); }
  if (type === 'angry') {
    for (const sx of [-1, 1]) {
      const br = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.05), BLACK);
      br.position.set(0.15 * sx, 0.14, 0.06); br.rotation.z = -0.45 * sx; g.add(br);
    }
  }
  if (type === 'cyclops') eye(0, 0.18);
  if (type === 'visor') {
    const v = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.17, 0.08), BLACK); g.add(v);
    const glow = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.02), new THREE.MeshBasicMaterial({ color: accent }));
    glow.position.z = 0.045; g.add(glow);
  }
  if (type === 'sleepy') {
    for (const sx of [-1, 1]) {
      const l = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.04, 0.04), BLACK); l.position.set(0.15 * sx, 0, 0.02); g.add(l);
    }
  }
}

function addHat(parent, y, type, accM, accentHex) {
  const g = new THREE.Group(); g.position.y = y; parent.add(g);
  if (type === 'horns') {
    for (const sx of [-1, 1]) {
      const h = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.38, 12), accM);
      h.position.set(0.22 * sx, 0.1, 0); h.rotation.z = -0.45 * sx; g.add(h);
    }
  } else if (type === 'crown') {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.25, 0.18, 20, 1, true), GOLD);
    c.material.side = THREE.DoubleSide; c.position.y = 0.04; g.add(c);
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2;
      const s = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.14, 8), GOLD);
      s.position.set(Math.sin(a) * 0.27, 0.19, Math.cos(a) * 0.27); g.add(s);
    }
  } else if (type === 'antenna') {
    const st = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.42, 8), BLACK); st.position.y = 0.17; g.add(st);
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 10), new THREE.MeshStandardMaterial({ color: accentHex, emissive: accentHex, emissiveIntensity: 0.8 }));
    b.position.y = 0.4; g.add(b);
  } else if (type === 'tophat') {
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.04, 24), accM); brim.position.y = -0.02; g.add(brim);
    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.45, 24), accM); top.position.y = 0.22; g.add(top);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.265, 0.265, 0.07, 24), mat(0xffffff)); band.position.y = 0.04; g.add(band);
  } else if (type === 'halo') {
    const h = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.04, 10, 32), new THREE.MeshBasicMaterial({ color: 0xfff3a0 }));
    h.rotation.x = Math.PI / 2; h.position.y = 0.3; h.userData.spin = true; g.add(h);
  } else if (type === 'mohawk') {
    for (let i = 0; i < 5; i++) {
      const m = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.3 - Math.abs(i - 2) * 0.05, 8), accM);
      m.position.set(0, 0.08, 0.24 - i * 0.12); m.rotation.x = -0.2 + i * 0.1; g.add(m);
    }
  }
  return g;
}

function buildWeapon(b) {
  const g = new THREE.Group();
  const tip = new THREE.Object3D();
  const ec = ELEM_COLOR[b.element];
  const headM = mat(b.wColor, { metalness: 0.55, roughness: 0.3, emissive: ec, emissiveIntensity: b.element === 'none' ? 0 : 0.3 });
  const gripLen = b.wHead === 'fist' || b.wHead === 'hand' ? 0 : b.gripLen;
  if (gripLen) {
    const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, gripLen, 10), mat(0x5a3b24));
    grip.position.y = gripLen / 2 - 0.15; g.add(grip);
  }
  const hy = gripLen - 0.15;
  // 先っぽは hd グループにまとめ、長さ・太さスライダーで拡大縮小する
  const outer = g;
  const hd = new THREE.Group(); hd.position.y = hy; outer.add(hd);
  {
    const L = b.bladeLen, W = b.bladeW, k = (L + W) / 2;
    const sc = { sword: [W, L, W], spear: [W, L, W], hammer: [L, W, W], axe: [W, L, L], orb: [k, k, k], fist: [k, k, k], hand: [1, 1, 1] }[b.wHead];
    hd.scale.set(...sc);
  }
  return finishWeapon(b, outer, hd, tip, headM, ec, gripLen);
}

function finishWeapon(b, outer, g, tip, headM, ec, gripLen) {
  const hy = 0;
  switch (b.wHead) {
    case 'sword': {
      const guard = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.06, 0.12), GOLD); guard.position.y = hy; g.add(guard);
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.0, 0.04), headM); blade.position.y = hy + 0.53; g.add(blade);
      const pt = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.16, 4), headM); pt.position.y = hy + 1.1; pt.rotation.y = Math.PI / 4; pt.scale.z = 0.3; g.add(pt);
      tip.position.y = hy + 1.1; break;
    }
    case 'hammer': {
      const h = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.38, 0.38), headM); h.position.y = hy + 0.17; g.add(h);
      tip.position.y = hy + 0.17; break;
    }
    case 'axe': {
      const blade = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.06, 24, 1, false, -Math.PI / 2, Math.PI), headM);
      blade.rotation.z = Math.PI / 2; blade.position.set(0, hy + 0.15, 0.04); g.add(blade);
      const spike = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 8), headM); spike.rotation.x = -Math.PI / 2; spike.position.set(0, hy + 0.15, -0.1); g.add(spike);
      tip.position.set(0, hy + 0.15, 0.42); break;
    }
    case 'spear': {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.025, 8, 16), GOLD); ring.rotation.x = Math.PI / 2; ring.position.y = hy; g.add(ring);
      const c = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.5, 12), headM); c.position.y = hy + 0.25; g.add(c);
      tip.position.y = hy + 0.5; break;
    }
    case 'orb': {
      const o = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 16),
        new THREE.MeshStandardMaterial({ color: b.wColor, emissive: b.element === 'none' ? b.wColor : ec, emissiveIntensity: 0.7, roughness: 0.2 }));
      o.position.y = hy + 0.22; g.add(o);
      for (let i = 0; i < 3; i++) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.24, 0.04), GOLD);
        const a = i / 3 * Math.PI * 2; p.position.set(Math.sin(a) * 0.14, hy + 0.08, Math.cos(a) * 0.14); p.rotation.set(Math.cos(a) * 0.5, 0, -Math.sin(a) * 0.5); g.add(p);
      }
      tip.position.y = hy + 0.22; break;
    }
    case 'fist': {
      const f = new THREE.Mesh(new THREE.SphereGeometry(0.27, 18, 14), headM); f.scale.set(1, 0.9, 1.15); f.position.y = 0.23; g.add(f);
      tip.position.y = 0.23; break;
    }
    case 'hand': {   // 素手：小さめのこぶし（アクセントの色。属性があればうっすら光る）
      const m = mat(b.accent, { emissive: ec, emissiveIntensity: b.element === 'none' ? 0 : 0.35 });
      const f = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 12), m); f.scale.set(1, 0.85, 1.1); f.position.y = 0.12; g.add(f);
      tip.position.y = 0.12; break;
    }
  }
  g.add(tip);
  return { group: outer, tip };
}

/* ---- 手書きキャラ：描いた絵を切り抜いて、厚紙のような立体にする ---- */
const drawCache = new Map();   // dataURL → { canvas, aspect } / null（空）
function processDrawing(url, src) {
  const W = src.width, H = src.height;
  const data = src.getContext('2d').getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (data[(y * W + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) { drawCache.set(url, null); return null; }
  const pad = 3; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
  const c = document.createElement('canvas'); c.width = x1 - x0 + 1; c.height = y1 - y0 + 1;
  c.getContext('2d').drawImage(src, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
  const info = { canvas: c, aspect: c.width / c.height };
  drawCache.set(url, info);
  return info;
}
function ensureDrawing(url) {
  if (!url || drawCache.has(url)) return Promise.resolve(drawCache.get(url));
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
      c.getContext('2d').drawImage(img, 0, 0);
      res(processDrawing(url, c));
    };
    img.onerror = () => { drawCache.set(url, null); res(null); };
    img.src = url;
  });
}
function buildPaper(info) {
  let H = 1.9, W = H * info.aspect;
  if (W > 2.2) { W = 2.2; H = W / info.aspect; }
  const tex = new THREE.CanvasTexture(info.canvas); tex.colorSpace = THREE.SRGBColorSpace;
  const geo = new THREE.PlaneGeometry(W, H);
  const g = new THREE.Group();
  const mats = [];
  const LAYERS = 7, THICK = 0.14;
  for (let i = 0; i < LAYERS; i++) {
    const face = i === 0 || i === LAYERS - 1;
    const m = new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.85, color: face ? 0xffffff : 0x6a6a7a });
    const mesh = new THREE.Mesh(geo, m);
    mesh.position.set(0, H / 2, -THICK / 2 + i * THICK / (LAYERS - 1));
    mesh.castShadow = true;
    mesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.5 });
    g.add(mesh);
    if (face) mats.push(m);
  }
  return { group: g, W, H, mats };
}

function buildCharacter(b) {
  const root = new THREE.Group();
  const inner = new THREE.Group(); inner.scale.setScalar(sizeOf(b)); root.add(inner);
  const accM = mat(b.accent);
  const info = DRAW_ON && b.bodyMode === 'draw' ? drawCache.get(b.drawing) : null;
  if (info) return finishCharacter(b, root, inner, accM, info);
  const bodyM = mat(b.color);
  const footGeo = new THREE.SphereGeometry(0.2, 16, 12);
  const feet = [];
  for (const sx of [-1, 1]) {
    const f = new THREE.Mesh(footGeo, accM); f.scale.set(1, 0.7, 1.3); f.position.set(0.25 * sx, 0.14, 0.05); inner.add(f); feet.push(f);
  }
  const torso = new THREE.Group(); inner.add(torso);
  let body, top, halfW, bodyY, faceZ, eyeY, noFeet = false;
  const glowM = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity });   // 光る飾り（状態の色で上書きされない）
  switch (b.body) {
    case 'cube':   body = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.8), bodyM); bodyY = 0.75; top = 1.25; halfW = 0.5; faceZ = 0.41; break;
    case 'ball':   body = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 24), bodyM); bodyY = 0.85; top = 1.43; halfW = 0.6; faceZ = 0.5; break;
    case 'pillar': body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.2, 28), bodyM); bodyY = 0.85; top = 1.45; halfW = 0.45; faceZ = 0.44; break;
    // ここから下は勝ち抜きの階層の敵だけの形（見た目だけ。当たり判定・強さは体の大きさで決まり、ほかと同じ）
    case 'crystal': {   // 氷の結晶
      body = new THREE.Mesh(new THREE.OctahedronGeometry(0.66), bodyM); body.scale.set(1, 1.35, 0.85); bodyY = 0.95; top = 1.84; halfW = 0.55; faceZ = 0.42; eyeY = 1.1;
      for (const [x, y, k] of [[-0.55, 0.5, 0.3], [0.6, 0.65, 0.24], [0.1, 1.95, 0.2]]) { const c = new THREE.Mesh(new THREE.OctahedronGeometry(k), glowM(0xbff4ff, 0.75)); c.position.set(x, y, -0.1); torso.add(c); }
      break;
    }
    case 'magma': {   // 溶岩のかたまり（光るひび）
      body = new THREE.Mesh(new THREE.DodecahedronGeometry(0.64), bodyM); bodyY = 0.85; top = 1.45; halfW = 0.6; faceZ = 0.5; eyeY = 1.02;
      const cracks = new THREE.LineSegments(new THREE.EdgesGeometry(body.geometry), new THREE.LineBasicMaterial({ color: 0xffa020 }));
      cracks.scale.setScalar(1.01); body.add(cracks);
      break;
    }
    case 'cloud': {   // 雷雲
      body = new THREE.Group(); bodyY = 0.9; top = 1.45; halfW = 0.7; faceZ = 0.52; eyeY = 0.98;
      for (const [x, y, z, r] of [[0, 0, 0, 0.5], [-0.42, -0.08, 0, 0.36], [0.42, -0.06, 0, 0.38], [0, 0.32, -0.05, 0.38], [-0.2, -0.22, 0.18, 0.3], [0.22, -0.2, 0.2, 0.3]]) {
        const p = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), bodyM); p.position.set(x, y, z); body.add(p);
      }
      for (const sx of [-1, 1]) { const z = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.4, 4), glowM(0xffe94a, 1)); z.position.set(sx * 0.35, -0.55, 0.1); z.rotation.z = sx * 0.4 + Math.PI; body.add(z); }
      noFeet = true;
      break;
    }

function finishCharacter(b, root, inner, accM, info, parts) {
  let feet, torso, hat, halfW, bodyY, headTop, mats, paper = null;
  if (info) {
    // 手書き：絵の板を胴体として使い、足や頭は作らない
    const pp = buildPaper(info);
    torso = new THREE.Group(); inner.add(torso);
    paper = pp.group; torso.add(paper);
    feet = [new THREE.Object3D(), new THREE.Object3D()];
    hat = new THREE.Group();
    halfW = Math.min(pp.W / 2, 0.75) * 0.85; bodyY = pp.H * 0.42; headTop = pp.H;
    mats = [...pp.mats, accM];
  } else ({ feet, torso, hat, halfW, bodyY, headTop, mats } = parts);

  // 腕（右手に武器）
  const armPivot = new THREE.Group();
  armPivot.position.set(-(halfW + 0.14), bodyY, paper ? 0.18 : 0.05);
  armPivot.userData.base = armPivot.position.clone();
  torso.add(armPivot);
  if (b.wHead !== 'fist' && b.wHead !== 'hand') { const hand = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), accM); armPivot.add(hand); }
  const weapon = buildWeapon(b);
  armPivot.add(weapon.group);
  let offHand = null;
  if (!paper) {
    offHand = new THREE.Mesh(new THREE.SphereGeometry(b.wHead === 'hand' ? 0.16 : 0.13, 12, 10), accM);
    // 素手はボクサーの構え：反対の拳を顔の前あたりに上げる
    if (b.wHead === 'hand') offHand.position.set(halfW * 0.7, bodyY + 0.25, 0.42); else offHand.position.set(halfW + 0.12, bodyY - 0.1, 0.05);
    offHand.userData.base = offHand.position.clone();
    torso.add(offHand);
  }

  shadowAll(armPivot);
  if (!paper) shadowAll(root);

  // バリア・スタン表示
  const shield = new THREE.Mesh(new THREE.SphereGeometry(1.1, 24, 16),
    new THREE.MeshBasicMaterial({ color: 0x7fe3ff, transparent: true, opacity: 0.28, depthWrite: false }));
  shield.position.y = 0.9; shield.visible = false; inner.add(shield);
  // ガードの盾：体の前を覆う半球のドーム（どの角度から見ても形が分かる）
  const guard = new THREE.Mesh(new THREE.SphereGeometry(0.95, 28, 16, 0, Math.PI),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4, depthWrite: false, side: THREE.DoubleSide }));
  guard.scale.z = 0.75; guard.position.set(0, 0.85, 0.15); guard.visible = false; inner.add(guard);
  const chargeRing = new THREE.Mesh(new THREE.RingGeometry(0.62, 0.8, 40), new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true, opacity: 0.8, depthWrite: false, side: THREE.DoubleSide }));
  chargeRing.rotation.x = -Math.PI / 2; chargeRing.position.y = 0.06; chargeRing.visible = false; inner.add(chargeRing);
  const stars = new THREE.Group(); stars.position.y = headTop + 0.25; stars.visible = false; inner.add(stars);
  for (let i = 0; i < 3; i++) {
    const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.09), new THREE.MeshBasicMaterial({ color: 0xffee33 }));
    const a = i / 3 * Math.PI * 2; s.position.set(Math.sin(a) * 0.4, 0, Math.cos(a) * 0.4); stars.add(s);
  }

  return { root, inner, torso, feet, armPivot, offHand, tip: weapon.tip, hat, mats, shield, guard, chargeRing, stars, paper, height: (headTop + 0.2) * sizeOf(b) };
}

const DOT_TEX = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const x = c.getContext('2d'), g = x.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.6, 'rgba(255,255,255,0.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(c);
})();
function buildAmbient(stg) {
  const ticks = [];
  const rnd = (a, b) => a + Math.random() * (b - a);

  const particles = (n, color, size, opacity, area, vel, extra = {}) => {
    const pos = new Float32Array(n * 3), sp = new Float32Array(n);
    for (let i = 0; i < n; i++) { const a = rnd(0, 6.283), r = rnd(area.r0, area.r1); pos.set([Math.cos(a) * r, rnd(area.y0, area.y1), Math.sin(a) * r], i * 3); sp[i] = rnd(0.6, 1.4); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const pts = new THREE.Points(g, new THREE.PointsMaterial({ color, size, map: DOT_TEX, transparent: true, opacity, depthWrite: false, ...extra }));
    arena.add(pts);
    let T = 0;
    ticks.push(dt => {
      T += dt;
      for (let i = 0; i < n; i++) {
        const k = i * 3;
        pos[k] += Math.sin(T * 0.8 + i) * vel.sway * dt; pos[k + 1] += vel.y * sp[i] * dt; pos[k + 2] += Math.cos(T * 0.7 + i) * vel.sway * dt;
        if (pos[k + 1] < area.y0) pos[k + 1] = area.y1; else if (pos[k + 1] > area.y1) pos[k + 1] = area.y0;
      }
      g.attributes.position.needsUpdate = true;
    });
  };
  const far = (m, x, y, z) => { m.position.set(x, y, z); m.traverse(o => { if (o.material) o.material.fog = false; }); arena.add(m); return m; };
  switch (stg.amb) {
    case 'snow': {   // 雪と、遠くの氷の柱
      particles(500, 0xffffff, 0.28, 0.9, { r0: 0, r1: 28, y0: -12, y1: 16 }, { y: -1.4, sway: 0.5 });
      for (let i = 0; i < 9; i++) {
        const a = i / 9 * 6.283 + rnd(-0.2, 0.2), h = rnd(6, 16);
        const c = new THREE.Mesh(new THREE.ConeGeometry(rnd(1, 2), h, 6), new THREE.MeshStandardMaterial({ color: 0xbfe8ff, roughness: 0.15, metalness: 0.2, transparent: true, opacity: 0.85 }));
        c.position.set(Math.cos(a) * rnd(32, 42), h / 2 - 10, Math.sin(a) * rnd(32, 42)); arena.add(c);
      }
      break;
    }
    case 'ember': {   // 舞い上がる火の粉と、遠くの火山

      for (const [a, d, h] of [[0.6, 48, 18], [2.3, 52, 24], [4.1, 46, 15], [5.3, 55, 20]]) {
        const v = new THREE.Group();
        v.add(new THREE.Mesh(new THREE.ConeGeometry(h * 0.8, h, 7), mat(0x2a1512)));
        const lava = new THREE.Mesh(new THREE.SphereGeometry(h * 0.16, 12, 8), new THREE.MeshBasicMaterial({ color: 0xff5a1a })); lava.position.y = h / 2; v.add(lava);
        v.position.set(Math.cos(a) * d, h / 2 - 14, Math.sin(a) * d); arena.add(v);

    }
    case 'rain': {   // 雨と、ときどき光る遠くの雷
      const n = 600, pos = new Float32Array(n * 6);
      const drop = i => { const a = rnd(0, 6.283), r = rnd(0, 26), x = Math.cos(a) * r, z = Math.sin(a) * r, y = rnd(-10, 18); pos.set([x, y, z, x + 0.08, y + 0.7, z], i * 6); };
      for (let i = 0; i < n; i++) drop(i);

      arena.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xb8c4ff, transparent: true, opacity: 0.45 })));
      const flash = new THREE.AmbientLight(0xdfe4ff, 0); arena.add(flash);
      let next = rnd(1.5, 4), on = 0, bolt = null;
      ticks.push(dt => {
        for (let i = 0; i < n; i++) { const k = i * 6; pos[k + 1] -= 24 * dt; pos[k + 4] -= 24 * dt; if (pos[k + 1] < -10) drop(i); }
        g.attributes.position.needsUpdate = true;
        next -= dt; on = Math.max(0, on - dt);

    }
    case 'bubble': {   // わき上がる毒の泡と、遠くの枯れ木

        tree.position.set(Math.cos(a) * d, h / 2 - 9, Math.sin(a) * d); arena.add(tree);
      }
      break;
    }
    case 'space': {   // 星空と惑星
      const n = 900, pos = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) { const u = rnd(-1, 1), a = rnd(0, 6.283), r = 70, q = Math.sqrt(1 - u * u); pos.set([Math.cos(a) * q * r, u * r, Math.sin(a) * q * r], i * 3); }
      const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.9, map: DOT_TEX, transparent: true, depthWrite: false, fog: false })); arena.add(stars);
      const planet = new THREE.Group();
      planet.add(new THREE.Mesh(new THREE.SphereGeometry(9, 32, 24), new THREE.MeshStandardMaterial({ color: 0xd98a4a, roughness: 0.9 })));
      const ring = new THREE.Mesh(new THREE.RingGeometry(11.5, 16, 64), new THREE.MeshBasicMaterial({ color: 0xf2c98a, transparent: true, opacity: 0.6, side: THREE.DoubleSide }));
      ring.rotation.x = Math.PI / 2.4; planet.add(ring); planet.rotation.z = 0.35;
      planet.scale.setScalar(1.3); far(planet, -34, 0, -66);
      far(new THREE.Mesh(new THREE.SphereGeometry(3.6, 24, 16), new THREE.MeshStandardMaterial({ color: 0x9aa4c8, roughness: 1 })), 30, 6, -56);
      far(new THREE.Mesh(new THREE.SphereGeometry(5, 24, 16), new THREE.MeshStandardMaterial({ color: 0x4a8adf, roughness: 0.7 })), 46, -8, 34);
      ticks.push(dt => { stars.rotation.y += dt * 0.01; planet.rotation.y += dt * 0.05; });
      break;
    }
  }
  arena.userData.tick = dt => { for (const t of ticks) t(dt); };
}

function sfxOut() {

function sfx(kind) {
  if (netRec()) NET.events.push(['sfx', kind]);
  if (MUTE) return;
  try {
    if (AC?.state === 'closed') AC = null;
    AC ??= new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state !== 'running') AC.resume?.().catch(() => {});   // iPhone は suspended のほかに interrupted（電話・通知のあと）でも止まる
    const t = AC.currentTime;
    const tone = (f1, f2, dur, type = 'square', vol = 0.12) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(sfxOut()); o.start(t); o.stop(t + dur);
    };

      const buf = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);

    };

      case 'swing': noise(0.12, 0.08, 2500); break;
      case 'hit': noise(0.15, 0.25, 400); tone(180, 60, 0.15, 'sine', 0.3); break;
      case 'big': noise(0.3, 0.35, 200); tone(120, 40, 0.3, 'sine', 0.4); break;
      case 'jump': tone(300, 700, 0.12, 'sine', 0.08); break;
      case 'skill': tone(400, 1200, 0.25, 'sawtooth', 0.07); break;
      case 'block': tone(1200, 900, 0.15, 'triangle', 0.15); break;
      case 'guard': tone(1500, 1350, 0.28, 'square', 0.07); tone(2250, 2000, 0.22, 'triangle', 0.09); tone(980, 900, 0.32, 'sine', 0.12); noise(0.05, 0.12, 4000); break;
      case 'chargeStart': tone(220, 520, 0.35, 'sawtooth', 0.05); break;
      case 'chargeFull': tone(1760, 1760, 0.18, 'triangle', 0.1); tone(2640, 2640, 0.22, 'sine', 0.07); break;
      case 'tap': tone(1800, 1200, 0.04, 'square', 0.08); tone(260, 180, 0.05, 'sine', 0.12); break;
      case 'shot': tone(900, 300, 0.15, 'square', 0.06); break;
      case 'ko': tone(600, 80, 0.8, 'sawtooth', 0.15); noise(0.6, 0.3, 150); break;
      case 'select': tone(660, 990, 0.06, 'square', 0.05); break;
      case 'shatter': noise(0.6, 0.45, 2500); noise(0.25, 0.3, 300); tone(2400, 500, 0.5, 'triangle', 0.08); break;
      case 'go': tone(523, 1046, 0.3, 'square', 0.08); break;
      case 'star': tone(1568, 2093, 0.12, 'triangle', 0.1); tone(2637, 3136, 0.35, 'sine', 0.08); break;   // キラーン

function readPad(i) {

  out.mx = ax; out.mz = ay;
  const now = { a: b(0), x: b(2), s: b(1) || b(3) };

      knob.style.transform = ''; stick.classList.add('idle');

      const b = e.target.closest('.tb');

        e.preventDefault();

function readInput(i, alsoOther) {
  const sets = alsoOther ? [BINDS[0], BINDS[1]] : [BINDS[i]];
  const any = (list) => list.some(c => keys.has(c));
  const anyP = (list) => list.some(c => pressed.has(c));
  const r = readPad(i);
  const T = touchIn[i];
  r.mx += T.mx; r.mz += T.mz;
  r.attack ||= T.atk; r.skill ||= T.skl; r.jump ||= T.jmp; r.guard ||= T.grd; r.attackHeld ||= !!T.atkHeld;
  T.atk = T.skl = T.jmp = false;
  for (const B of sets) {
    r.mx += (any(B.right) ? 1 : 0) - (any(B.left) ? 1 : 0);
    r.mz += (any(B.down) ? 1 : 0) - (any(B.up) ? 1 : 0);
    r.attack ||= anyP(B.atk); r.skill ||= anyP(B.skl); r.jump ||= anyP(B.jmp); r.guard ||= any(B.grd); r.attackHeld ||= any(B.atk);
  }
  const l = Math.hypot(r.mx, r.mz); if (l > 1) { r.mx /= l; r.mz /= l; }
  return r;
}

const particles = [];
const pGeo = new THREE.BoxGeometry(1, 1, 1);
const pMats = {};
function pMat(c) { return pMats[c] ??= new THREE.MeshBasicMaterial({ color: c }); }
function burst(pos, color, n = 10, speed = 6, size = 0.14, gravity = 14, life = 0.5) {
  if (netRec()) NET.events.push(['burst', [pos.x, pos.y, pos.z], color, n, speed, size, gravity, life]);
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(pGeo, pMat(color));
    m.position.copy(pos); m.scale.setScalar(size * (0.6 + Math.random() * 0.8));
    m.rotation.set(Math.random() * 3, Math.random() * 3, 0);
    const v = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 1.4 - 0.2, Math.random() * 2 - 1).normalize().multiplyScalar(speed * (0.4 + Math.random() * 0.6));
    scene.add(m);
    particles.push({ m, v, life: life * (0.6 + Math.random() * 0.6), max: life, g: gravity, s: m.scale.x });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { scene.remove(p.m); particles.splice(i, 1); continue; }
    p.v.y -= p.g * dt; p.m.position.addScaledVector(p.v, dt);
    p.m.rotation.x += dt * 6; p.m.scale.setScalar(p.s * Math.max(0.05, p.life / p.max));
  }
}

const effects = [];
function ringFx(pos, color, maxR = 3.5, dur = 0.45) {
  if (netRec()) NET.events.push(['ring', [pos.x, pos.y, pos.z], color, maxR, dur]);
  const m = new THREE.Mesh(new THREE.TorusGeometry(1, 0.12, 8, 48), new THREE.MeshBasicMaterial({ color, transparent: true }));
  m.rotation.x = Math.PI / 2; m.position.copy(pos); m.position.y += 0.1; scene.add(m);
  effects.push({ t: 0, dur, update(e) { const k = e.t / dur; m.scale.setScalar(0.2 + k * maxR); m.material.opacity = 1 - k; }, dispose() { scene.remove(m); m.geometry.dispose(); m.material.dispose(); } });
}
// ガードした瞬間、盾の位置から六角形の波紋を広げる

const fxGeo = { plane: new THREE.PlaneGeometry(1, 1), ring: new THREE.RingGeometry(0.7, 1, 40), oct: new THREE.OctahedronGeometry(1), sph: new THREE.SphereGeometry(1, 10, 8) };

function fxHit(pos, dir, elem, big) {

  try {
    const col = ELEM_COLOR[elem] ?? 0xffffff;
    // 衝撃の輪（カメラの方を向いて広がる）
    const ring = fxMesh(fxGeo.ring, big ? 0xfff3b0 : 0xffffff, 0.9);
    ring.position.copy(pos); ring.lookAt(camera.position); scene.add(ring);
    const rMax = (big ? 2.6 : 1.5) * FXB.size;
    effects.push({ t: 0, dur: 0.34, update(e) { const k = e.t / 0.34; ring.scale.setScalar(0.3 + k * rMax); ring.material.opacity = 0.9 * (1 - k); }, dispose() { scene.remove(ring); ring.material.dispose(); } });

    const slash = fxMesh(fxGeo.plane, 0xffffff, 1);
    slash.position.copy(pos); slash.lookAt(camera.position);
    const sAng = Math.atan2(-dir.z, dir.x) + (Math.random() - 0.5) * 0.6;
    slash.rotateZ(sAng);
    scene.add(slash);
    const len = (big ? 3.2 : 2.2) * FXB.size;
    effects.push({ t: 0, dur: 0.2, update(e) { const k = e.t / 0.2; slash.scale.set(len * (0.4 + k), 0.34 * (1 - k) + 0.03, 1); slash.material.opacity = 1 - k; }, dispose() { scene.remove(slash); slash.material.dispose(); } });
