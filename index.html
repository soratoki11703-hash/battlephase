<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>バトルフェーズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1530;
    --ink: #fff;
    --panel: rgba(22, 18, 40, 0.88);
    --line: rgba(255, 255, 255, 0.14);
    --p1: #ff4d6d;
    --p2: #3fa9ff;
    --gold: #ffd23f;
    --muted: #b9b2d6;
    --shade: rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: var(--bg); color: var(--ink);
    font-family: "M PLUS Rounded 1c", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; }
  button { touch-action: manipulation; }
  button { font-family: inherit; cursor: pointer; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: flex; }

  /* タイトル */
  #title { flex-direction: column; align-items: center; justify-content: center; gap: 18px; pointer-events: none; }
  #title > * { pointer-events: auto; }
  .logo { font-family: "Mochiy Pop One", sans-serif; font-size: clamp(44px, 9vw, 110px); line-height: 1; letter-spacing: 2px;
    color: var(--gold); text-shadow: 0 6px 0 #c2410c, 0 12px 30px rgba(0,0,0,.5); transform: rotate(-3deg); margin: 0; }
  .sub { font-weight: 800; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.7); margin: 0 0 14px; font-size: 18px; }
  .big-btn { font-family: "Mochiy Pop One", sans-serif; font-size: 22px; padding: 16px 34px; min-width: 300px; border: none; border-radius: 18px;
    color: #fff; background: var(--p1); box-shadow: 0 6px 0 rgba(0,0,0,.35); transition: transform .08s; }
  .big-btn:hover { transform: translateY(-2px) scale(1.03); }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .big-btn.blue { background: var(--p2); }
  .big-btn.gold { background: var(--gold); color: #3b2300; }
  .big-btn.ghost { background: rgba(27, 21, 48, .72); }
  .hint { color: var(--ink); font-size: 13px; text-align: center; line-height: 1.7; background: rgba(27, 21, 48, .72); padding: 8px 14px; border-radius: 12px; margin: 4px 16px 0; }

  /* クリエイター */
  #create { pointer-events: none; }
  .panel { pointer-events: auto; width: 430px; max-width: 100%; height: 100%; overflow-y: auto; background: var(--panel);
    backdrop-filter: blur(8px); border-right: 1px solid var(--line);
    padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(120px + env(safe-area-inset-bottom, 0px)) calc(18px + env(safe-area-inset-left, 0px)); }
  .ph { display: flex; align-items: center; gap: 10px; font-family: "Mochiy Pop One", sans-serif; font-size: 22px; margin-bottom: 12px; }
  .badge { font-size: 15px; padding: 4px 10px; border-radius: 10px; background: var(--p1); }
  .badge.p2 { background: var(--p2); }
  .row { display: flex; gap: 8px; align-items: center; }
  .name-in { flex: 1; font: 800 20px "M PLUS Rounded 1c"; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line);
    background: rgba(0,0,0,.3); color: #fff; outline: none; min-width: 0; }
  .name-in:focus { border-color: var(--gold); }
  .sq { width: 46px; height: 46px; border-radius: 12px; border: none; background: rgba(255,255,255,.12); color: #fff; font-size: 22px; flex: none; }
  h3 { margin: 18px 0 6px; font-size: 13px; color: var(--gold); letter-spacing: 1px; }
  h2.sec { margin: 22px 0 4px; font-family: "Mochiy Pop One"; font-size: 17px; border-top: 1px dashed var(--line); padding-top: 14px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { border: 2px solid transparent; background: rgba(255,255,255,.09); color: #fff; padding: 7px 11px; border-radius: 10px; font-weight: 800; font-size: 14px; }
  .opt:hover { background: rgba(255,255,255,.18); }
  .opt.sel { border-color: var(--gold); background: rgba(255,210,63,.18); }
  .opts.vis { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; }
  .opt.card { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px 7px; border-radius: 14px; min-width: 0; }
  .opt.card img, .opt.card .ico { width: 64px; height: 64px; display: block; }
  .opt.card img[src=""] { visibility: hidden; }
  .opt.card .ico { display: grid; place-items: center; font-size: 34px; border-radius: 50%; }
  .opt.card span { font-size: 12px; line-height: 1.2; text-align: center; }
  details.look { margin-top: 22px; border-top: 1px dashed var(--line); padding-top: 14px; }
  details.look summary { font-family: "Mochiy Pop One", sans-serif; font-size: 16px; cursor: pointer; list-style: none; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.08); }
  details.look summary::-webkit-details-marker { display: none; }
  details.look[open] summary { background: rgba(255,210,63,.18); }
  .mode-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .mode-tabs .opt { padding: 10px 6px; font-size: 14px; }
  .padwrap { margin-top: 10px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .padwrap[hidden] { display: none; }
  #pad { width: 100%; max-width: 320px; aspect-ratio: 1; border-radius: 14px; touch-action: none; cursor: crosshair; display: block;
    background-color: #f4f1fa; background-image: linear-gradient(#e2dcef 1px, transparent 1px), linear-gradient(90deg, #e2dcef 1px, transparent 1px);
    background-size: 32px 32px; border: 2px solid var(--line); }
  .pal { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pal button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
  .pal button.sel { border-color: var(--gold); }
  .pal input[type=color] { width: 34px; height: 30px; }
  .ptools { display: flex; flex-wrap: wrap; gap: 6px; }
  .ptools .tool.sel { background: rgba(255,210,63,.3); outline: 2px solid var(--gold); }
  .slider { display: grid; grid-template-columns: 92px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; font-weight: 800; margin-top: 8px; }
  .slider output { text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); }
  .slider input:disabled { opacity: .35; }
  .pts { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .pt-row { display: grid; grid-template-columns: 96px 32px 1fr 32px; gap: 8px; align-items: center; }
  .pt-row .lb { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .pt-row button.pm { width: 32px; height: 32px; border-radius: 10px; border: none; background: rgba(255,255,255,.12); color: var(--ink); font-size: 18px; font-weight: 800; }
  .pt-row button.pm:disabled { opacity: .3; }
  .pips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
  .pips i { height: 18px; border-radius: 4px; background: rgba(255,255,255,.1); cursor: pointer; }
  .pips i.on { background: linear-gradient(180deg, #ffd23f, #ff8a3d); }
  .pt-left { font-size: 14px; color: var(--gold); margin-left: 8px; }
  .pt-left.zero { color: var(--muted); }
  .desc { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 1.2em; }
  .colors { display: flex; gap: 14px; flex-wrap: wrap; }
  .colors label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; }
  input[type=color] { width: 42px; height: 32px; border: none; border-radius: 8px; background: none; padding: 0; cursor: pointer; }
  input[type=range] { width: 100%; accent-color: var(--gold); }
  .stats { margin-top: 10px; display: grid; grid-template-columns: 80px 1fr; gap: 6px 10px; align-items: center; font-size: 13px; font-weight: 800; }
  .bar { height: 10px; background: rgba(255,255,255,.1); border-radius: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #ffd23f, #ff6b35); border-radius: 6px; transition: width .2s; }
  .roster { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 4px 5px 10px; border-radius: 20px; background: rgba(255,255,255,.1);
    border: none; color: #fff; font-weight: 800; font-size: 13px; }
  .chip i { font-style: normal; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.3); font-size: 11px; }
  .chip .dot { width: 12px; height: 12px; border-radius: 50%; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tool { border: none; background: rgba(255,255,255,.12); color: #fff; padding: 8px 12px; border-radius: 10px; font-weight: 800; font-size: 13px; }
  .tool:hover { background: rgba(255,255,255,.22); }
  .go-bar { position: fixed; right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; pointer-events: auto; }
  .go-bar .big-btn { min-width: 0; }

  /* HUD */
  #hud { pointer-events: none; flex-direction: column; }
  .hud-top { display: flex; justify-content: space-between; gap: 20px;
    padding: calc(14px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) 14px calc(18px + env(safe-area-inset-left, 0px)); }
  .pl { width: min(40vw, 420px); }
  .pl.r { text-align: right; }
  .pl .nm { font-family: "Mochiy Pop One"; font-size: 20px; text-shadow: 0 2px 6px #000; display: flex; gap: 8px; align-items: center; }
  .pl.r .nm { flex-direction: row-reverse; }
  .hp { position: relative; height: 20px; border-radius: 10px; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.8); overflow: hidden; margin-top: 6px; }
  .hp .lag, .hp .cur { position: absolute; top: 0; bottom: 0; left: 0; }
  .pl.r .hp .lag, .pl.r .hp .cur { left: auto; right: 0; }
  .hp .lag { background: #fff; }
  .gb { height: 6px; margin-top: 4px; border-radius: 3px; background: rgba(0,0,0,.45); overflow: hidden; }
  .gb i { display: block; height: 100%; background: #9fd8ff; border-radius: 3px; }
  .pl.r .gb i { margin-left: auto; }
  .gb i.low { background: #ff6b6b; }
  .hp .cur { background: linear-gradient(90deg, #4ade80, #a3e635); }
  .hp .cur.low { background: linear-gradient(90deg, #ef4444, #f97316); }
  .pl .meta { margin-top: 6px; display: flex; gap: 10px; font-size: 13px; font-weight: 800; text-shadow: 0 1px 4px #000; align-items: center; }
  .pl.r .meta { flex-direction: row-reverse; }
  .spg { position: relative; display: inline-block; min-width: 104px; height: 24px; border-radius: 12px; overflow: hidden;
    background: rgba(0,0,0,.5); border: 2px solid rgba(255,255,255,.45); }
  .spg i { position: absolute; top: 0; bottom: 0; left: 0; background: linear-gradient(90deg, #ff9f1c, #ffd23f); }
  .pl.r .spg i { left: auto; right: 0; }
  .spg b { position: relative; display: block; padding: 0 10px; line-height: 20px; font-size: 12px; color: #fff; text-shadow: 0 1px 2px #000; text-align: center; white-space: nowrap; }
  .spg.ready { border-color: #fff3b0; animation: spglow .7s ease-in-out infinite alternate; }
  .spg.ready b { color: #3b2300; text-shadow: none; }
  @keyframes spglow { from { box-shadow: 0 0 4px #ffd23f; } to { box-shadow: 0 0 16px #ffd23f, 0 0 4px #fff; } }
  .stars { color: var(--gold); letter-spacing: 2px; font-size: 18px; }
  .rnd { font-family: "Mochiy Pop One"; font-size: 18px; text-shadow: 0 2px 6px #000; padding-top: 6px; white-space: nowrap; }
  .ctrl { position: fixed; bottom: 10px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 18px;
    font-size: 12px; color: rgba(255,255,255,.75); text-shadow: 0 1px 3px #000; font-weight: 800; }
  #announce { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #announce span { font-family: "Mochiy Pop One"; font-size: clamp(50px, 11vw, 140px); color: var(--gold);
    text-shadow: 0 6px 0 #c2410c, 0 10px 40px rgba(0,0,0,.6); animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(2.2) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(-3deg); opacity: 1; } }
  #shatter { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #shatter .pc { position: absolute; inset: 0; background-size: 100% 100%; will-change: transform, opacity; }
  #shatter svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #shatter .fl { position: absolute; inset: 0; background: #fff; }
  #dmg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .dn { position: absolute; font-family: "Mochiy Pop One"; font-size: 26px; color: #fff; -webkit-text-stroke: 1.5px #000;
    transform: translate(-50%, -50%); white-space: nowrap; }

  /* リザルト・ポーズ */
  #result, #pause { align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: rgba(10, 6, 25, .55); }
  .win-name { font-family: "Mochiy Pop One"; font-size: clamp(36px, 7vw, 80px); text-shadow: 0 6px 20px rgba(0,0,0,.6); }
  .win-label { font-family: "Mochiy Pop One"; font-size: 28px; color: var(--gold); }

  #toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: #000c; padding: 10px 18px; border-radius: 12px;
    font-weight: 800; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.on { opacity: 1; }
  body.touch #toast { bottom: auto; top: calc(118px + env(safe-area-inset-top, 0px)); width: max-content; max-width: calc(100% - 32px); text-align: center; line-height: 1.5; z-index: 30; }

  /* タッチ操作 */
  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .tpad { position: absolute; top: 28%; bottom: 0; pointer-events: auto; touch-action: none; }
  .tbtns { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: calc(18px + env(safe-area-inset-right, 0px)); width: 180px; height: 160px; }
  .tpad.mirror .tbtns { right: auto; left: 18px; }
  .tb { position: absolute; border-radius: 50%; border: 3px solid rgba(255,255,255,.7); color: #fff; font: 800 15px "M PLUS Rounded 1c", system-ui, sans-serif;
    background: rgba(255,255,255,.16); backdrop-filter: blur(4px); touch-action: none; padding: 0; }
  .tb { white-space: nowrap; }
  .tb.jmp { font-size: 12px; }
  .tb { transition: transform .06s, box-shadow .06s, filter .06s; overflow: visible; }
  .tb.on { transform: scale(.86); filter: brightness(1.45); box-shadow: 0 0 0 4px rgba(255,255,255,.55), 0 0 22px rgba(255,255,255,.6); }
  .tb .rip { position: absolute; inset: -3px; border-radius: 50%; border: 3px solid #fff; pointer-events: none; animation: rip .35s ease-out forwards; }
  @keyframes rip { from { transform: scale(.85); opacity: .9; } to { transform: scale(1.55); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .tb .rip { display: none; } }
  .tb.atk { width: 84px; height: 84px; right: 0; bottom: 0; background: rgba(255,77,109,.45); font-size: 18px; }
  .tb.skl { width: 62px; height: 62px; right: 92px; bottom: 6px; background: rgba(255,210,63,.35); }
  .tb.jmp { width: 62px; height: 62px; right: 14px; bottom: 92px; background: rgba(63,169,255,.4); }
  .tb.grd { width: 58px; height: 58px; right: 100px; bottom: 84px; background: rgba(160,160,190,.4); font-size: 12px; }
  .tpad.mirror .tb.grd { right: auto; left: 100px; }
  .tpad.mirror .tb.atk { right: auto; left: 0; }
  .tpad.mirror .tb.skl { right: auto; left: 92px; }
  .tpad.mirror .tb.jmp { right: auto; left: 14px; }
  .tb.skl { background: conic-gradient(rgba(255,190,40,.8) calc(var(--p, 1) * 1turn), rgba(255,255,255,.12) 0); }
  .tb.skl.ready { border-color: #fff3b0; animation: sklglow .7s ease-in-out infinite alternate; }
  @keyframes sklglow { from { box-shadow: 0 0 6px #ffd23f; } to { box-shadow: 0 0 24px #ffd23f; } }
  @media (prefers-reduced-motion: reduce) { .spg.ready, .tb.skl.ready { animation: none; box-shadow: 0 0 12px #ffd23f; } }
  .stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 3px solid rgba(255,255,255,.5);
    background: rgba(255,255,255,.08); pointer-events: none; }
  .stick i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(255,255,255,.75); }
  .stick.idle { opacity: .45; }
  .tlabel { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); font-weight: 800; font-size: 13px; padding: 2px 10px; border-radius: 10px; }
  #pauseBtn { display: none; pointer-events: auto; margin: 6px auto 0; border: none; border-radius: 10px; background: rgba(0,0,0,.4); color: #fff; font-weight: 800; padding: 6px 14px; font-size: 16px; }
  body.touch #pauseBtn { display: block; }
  body.touch .ctrl { display: none; }
  body.touch [data-go="2p"] { display: none; }
  .mid { display: flex; flex-direction: column; align-items: center; }

  /* コード入力モーダル */
  #modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(10,6,25,.7); padding: 16px; }
  #modal[hidden] { display: none; }
  .mbox { width: min(440px, 100%); background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .mbox b { font-family: "Mochiy Pop One", sans-serif; font-size: 18px; }
  #mText { width: 100%; height: 110px; resize: none; border-radius: 12px; border: 2px solid var(--line); background: var(--shade); color: var(--ink);
    font: 500 13px ui-monospace, Menlo, monospace; padding: 10px; user-select: text; -webkit-user-select: text; }
  .mbox .row { justify-content: flex-end; }

  @media (max-width: 800px) {
    .panel { position: absolute; bottom: 0; height: 55%; width: 100%; border-right: none; border-top: 1px solid var(--line); padding-top: 18px; }
    .go-bar { right: calc(12px + env(safe-area-inset-right, 0px)); bottom: auto; top: calc(12px + env(safe-area-inset-top, 0px)); }
    .big-btn { min-width: 240px; font-size: 18px; padding: 13px 26px; }
    .go-bar .big-btn { font-size: 15px; padding: 10px 16px; }
    .pl { width: 42vw; min-width: 0; }
    .pl .nm { font-size: 14px; gap: 6px; }
    .pl .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl .meta { gap: 6px; }
    .stars { font-size: 14px; letter-spacing: 0; }
    .spg { min-width: 0; max-width: 100%; }
    .spg b { font-size: 11px; padding: 0 8px; }
    .hp { height: 14px; }
    .rnd { font-size: 13px; }
    .hud-top { padding: calc(8px + env(safe-area-inset-top, 0px)) calc(10px + env(safe-area-inset-right, 0px)) 8px calc(10px + env(safe-area-inset-left, 0px)); gap: 8px; }
  }
  @media (max-height: 500px) {
    #title { gap: 8px; }
    .logo { font-size: 48px; }
    .sub { margin-bottom: 4px; }
    .big-btn { padding: 9px 22px; font-size: 16px; }
    .hint { display: none; }
    .panel { padding-bottom: 80px; }
  }
</style>
</head>
<body>

<div id="title" class="screen on">
  <h1 class="logo">バトルフェーズ</h1>
  <p class="sub">つくって、すぐ、なぐりあえ。</p>
  <button class="big-btn" data-go="2p">ふたりで対戦</button>
  <button class="big-btn blue" data-go="cpu">CPUと対戦</button>
  <button class="big-btn" data-go="best" id="bestGo" hidden>⭐ マイキャラで即バトル</button>
  <button class="big-btn gold" data-go="quick">🎲 おまかせ即バトル</button>
  <button class="big-btn ghost" data-go="watch">👀 CPU同士を観戦</button>
  <p class="hint">キャラも武器もその場で作って、そのまま対戦。<br>相手を場外に落とすか、HPを0にしたら勝ち。2本先取！</p>
</div>

<div id="create" class="screen">
  <div class="panel" id="panel"></div>
  <div class="go-bar">
    <button class="big-btn ghost" id="backBtn">もどる</button>
    <button class="big-btn gold" id="okBtn">けってい！</button>
  </div>
</div>

<div id="hud" class="screen">
  <div class="hud-top">
    <div class="pl" id="hud0"></div>
    <div class="mid"><div class="rnd" id="rnd">ROUND 1</div><button id="pauseBtn" aria-label="ポーズ">⏸</button></div>
    <div class="pl r" id="hud1"></div>
  </div>
  <div class="ctrl">
    <span id="ctrl0">1P：WASD 移動 ／ F 攻撃 ／ G 必殺 ／ H・Space ジャンプ ／ R ガード</span>
    <span id="ctrl1">2P：矢印 移動 ／ K 攻撃 ／ L 必殺 ／ I ジャンプ ／ O ガード</span>
  </div>
</div>
<div id="dmg"></div>
<div id="announce"></div>

<div id="result" class="screen">
  <div class="win-label">WINNER</div>

  fist:   { dmg: 9.2,   reach: 1.3,  wind: .06, active: .08, recover: .12, knock: 4.1,  move: 1.03, style: 'thrust' , light: true },

const ICONS = {
  element: { none: '⚪', fire: '🔥', ice: '❄️', thunder: '⚡', poison: '☠️', wind: '🌪️' },
  skill: { dash: '💨', shot: '☄️', shield: '🛡️', heal: '💚', quake: '💥', blink: '🌀' },
};
// 能力ポイント：合計 PT_TOTAL を6項目に振り分ける（各1〜10）
const PT_KEYS = [['hp', '❤️', '耐久', 'HPが増える'], ['def', '🛡️', 'かたさ', '受けるダメージが減る・ガードが長持ち'], ['spd', '👟', 'スピード', '移動が速くなる'],
                 ['pow', '💪', 'パワー', '攻撃ダメージが上がる'], ['jmp', '🦘', 'ジャンプ', '高く跳べる'], ['wt', '🪨', 'ふんばり', 'ふっとびにくくなる']];
const PT_TOTAL = 30, PT_MIN = 1, PT_MAX = 10;
const defaultPts = () => Object.fromEntries(PT_KEYS.map(([k]) => [k, 5]));
// 武器の長さがリーチにどれだけ効くか
const REACH_LEN = { sword: 1, spear: 0.5, axe: 0.42, hammer: 0.2, orb: 0, fist: 0 };
// 必殺は相手にダメージを与えると溜まる（この量で満タン）
// 回避ステップ：0.2秒で移動、そのうち 0.05〜0.22秒が無敵、0.40秒まで動けない（読まれると狩られる）
const DODGE = { speed: 15, move: 0.2, invEnd: 0.22, total: 0.40, cooldown: 0.5 };
// ため攻撃：攻撃ボタン長押し。振ったあと押しっぱなしでために入り、離すと強攻撃（ガードを割る）
const CHARGE = { min: 0.25, full: 0.8, max: 1.6, wind: 0.5, recover: 1.3 };
const BUFFER = 0.15;       // 先行入力：この秒数以内に押したボタンは、動けるようになった瞬間に出る
const GUARD_DRAIN = 12;    // ガード押しっぱなしで1秒あたり減るガードゲージ
// ふっとばし：低めの角度で飛ばし、空中でも減速する（強い攻撃ほど距離が二乗で伸びるのを防ぐ）

//   CPU同士で 場外17：HP0 22、1試合 平均50秒
const KB = { base: 0.45, grow: 2.5, lift: 0.1, liftMax: 6, airDrag: 1.4 };
const ORB_SPEED = 0.75;    // 魔法玉の弾の速さ（見てからよけられるように少し遅め）
const JUST_GUARD = 0.25;   // ガードを押してからこの秒数以内に受けるとジャストガード（スマホの遅れも考えて広め）
const SKILL_COST = { dash: 37, shot: 25, shield: 54, heal: 34, quake: 35, blink: 22 };
// 属性のおまけ効果（どれも「無属性のダメージ+15%」と同じくらいの価値になるよう CPU 総当たりで調整）
const ELEM_FX = { burn: 2, burnDps: 2.21, poison: 5, poisonDps: 1.589, slow: 2.3, stun: 0.19, noneBonus: 1.18, windKnock: 1.315 };

const NAME_A = ['ゴン','ピコ','ザン','モチ','ガル','ポン','キラ','ドド','メカ','ニャ','ボル','ルル','ジン','タコ','ベア','ズン','プリ','ギガ','チョコ','バク'];
const NAME_B = ['','丸','ン','X','太郎','マン','ゴン','すけ','キング','ちゃん','ZERO','ボーイ','ドン'];
const pick = a => a[Math.floor(Math.random() * a.length)];
const randName = () => pick(NAME_A) + pick(NAME_B);
const randColor = () => '#' + new THREE.Color().setHSL(Math.random(), 0.55 + Math.random() * 0.35, 0.45 + Math.random() * 0.2).getHexString();

function randomBuild() {
  const b = { name: randName(), size: 1,
              color: randColor(), accent: randColor(), wColor: randColor() };
  for (const k of Object.keys(OPTS)) b[k] = pick(OPTS[k])[0];
  const r = (lo, hi) => +(lo + Math.round(Math.random() * (hi - lo) / 0.05) * 0.05).toFixed(2);
  b.gripLen = r(0.2, 1.3); b.bladeLen = r(0.6, 1.6); b.bladeW = r(0.6, 1.6);
  b.pts = Object.fromEntries(PT_KEYS.map(([k]) => [k, PT_MIN]));
  for (let left = PT_TOTAL - PT_MIN * PT_KEYS.length; left > 0;) {
    const k = pick(PT_KEYS)[0];
    if (b.pts[k] < PT_MAX) { b.pts[k]++; left--; }
  }
  return b;
}
function defaultBuild(i) {
  return { name: i ? 'ブルー' : 'レッド', body: 'cube', head: 'ball', eyes: 'normal', hat: 'horns', size: 1,
           color: i ? '#3fa9ff' : '#ff4d6d', accent: '#2b2540', wHead: 'sword', element: 'fire',
           wColor: '#e5e7eb', skill: 'dash', gripLen: 0.55, bladeLen: 1, bladeW: 1, pts: defaultPts() };
}

function getStats(b) {
  const s = 1;   // サイズは全員共通
  const st = { hp: 100 * (0.6 + 0.4 * s), speed: 6.2 * (1.3 - 0.3 * s), def: 1, knockRes: 0.6 + 0.4 * s, jump: 10.5, radius: 0.55 * s };

  // 能力ポイント（5が標準＝×1.0、10で×1.3、1で×0.76）
  const P = defaultPts();   // 能力ポイントは廃止（全員同じ）
  const m = k => 0.7 + P[k] * 0.06;
  st.hp = Math.round(st.hp * m('hp'));
  st.def *= 2 - m('def');
  st.speed *= m('spd');
  st.jump *= 0.85 + P.jmp * 0.03;
  st.knockRes *= m('wt');
  st.guardMax = 60 + P.def * 8;
  // 武器：形から性能を計算（大きく重いほど強いが遅い）
  const w = { ...WEAPONS[b.wHead], type: b.wHead };
  // 武器の形スライダーは見た目だけ。性能は武器の種類で決まる
  const grip = 0.55, heavy = 1;
  w.dmg *= (0.7 + 0.3 * heavy) * m('pow');
  w.knock *= 0.7 + 0.3 * heavy;
  const slow = 0.75 + 0.25 * heavy + Math.max(0, grip - 0.55) * 0.3;
  w.wind *= slow; w.recover *= slow;
  w.reach = Math.max(0.9, (w.reach + (grip - 0.55) + (b.bladeLen - 1) * REACH_LEN[b.wHead]) * (0.6 + 0.4 * s));
  w.projSpeed = 16 + grip * 7;
  w.projR = 0.22 * Math.sqrt(heavy);
  // バランス：移動速度は武器ごとの計算値（攻撃力が高いほど遅い）
  st.speed *= w.move;
  st.weapon = w;
  st.element = b.element;
  st.skill = b.skill;
  return st;
}

/* =========================================================
   キャラクターのモデル
   ========================================================= */
function mat(color, extra = {}) { return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.05, ...extra }); }
const BLACK = mat(0x111111), WHITE = mat(0xffffff, { roughness: 0.3 });
const GOLD = mat(0xffcc33, { metalness: 0.7, roughness: 0.3 });

function shadowAll(o) { o.traverse(m => { if (m.isMesh) { m.castShadow = true; } }); }

function addEyes(parent, y, z, type, accent) {
  const g = new THREE.Group(); g.position.set(0, y, z); parent.add(g);
  const eye = (x, r) => {
    const w = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), WHITE); w.position.set(x, 0, 0); w.scale.z = 0.6; g.add(w);
    const p = new THREE.Mesh(new THREE.SphereGeometry(r * 0.5, 12, 10), BLACK); p.position.set(x, 0, r * 0.55); g.add(p);
  };
  if (type === 'normal' || type === 'angry') { eye(-0.15, 0.11); eye(0.15, 0.11); }
  if (type === 'angry') {
    for (const sx of [-1, 1]) {
      const br = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.05), BLACK);
      br.position.set(0.15 * sx, 0.14, 0.06); br.rotation.z = -0.45 * sx; g.add(br);
    }
  }
  if (type === 'cyclops') eye(0, 0.18);
  if (type === 'visor') {
    const v = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.17, 0.08), BLACK); g.add(v);
    const glow = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.02), new THREE.MeshBasicMaterial({ color: accent }));
    glow.position.z = 0.045; g.add(glow);
  }
  if (type === 'sleepy') {
    for (const sx of [-1, 1]) {
      const l = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.04, 0.04), BLACK); l.position.set(0.15 * sx, 0, 0.02); g.add(l);
    }
  }
}

function addHat(parent, y, type, accM, accentHex) {
  const g = new THREE.Group(); g.position.y = y; parent.add(g);
  if (type === 'horns') {
    for (const sx of [-1, 1]) {
      const h = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.38, 12), accM);
      h.position.set(0.22 * sx, 0.1, 0); h.rotation.z = -0.45 * sx; g.add(h);
    }
  } else if (type === 'crown') {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.25, 0.18, 20, 1, true), GOLD);
    c.material.side = THREE.DoubleSide; c.position.y = 0.04; g.add(c);
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2;
      const s = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.14, 8), GOLD);
      s.position.set(Math.sin(a) * 0.27, 0.19, Math.cos(a) * 0.27); g.add(s);
    }
  } else if (type === 'antenna') {
    const st = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.42, 8), BLACK); st.position.y = 0.17; g.add(st);
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 10), new THREE.MeshStandardMaterial({ color: accentHex, emissive: accentHex, emissiveIntensity: 0.8 }));
    b.position.y = 0.4; g.add(b);
  } else if (type === 'tophat') {
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.04, 24), accM); brim.position.y = -0.02; g.add(brim);
    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.45, 24), accM); top.position.y = 0.22; g.add(top);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.265, 0.265, 0.07, 24), mat(0xffffff)); band.position.y = 0.04; g.add(band);
  } else if (type === 'halo') {
    const h = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.04, 10, 32), new THREE.MeshBasicMaterial({ color: 0xfff3a0 }));
    h.rotation.x = Math.PI / 2; h.position.y = 0.3; h.userData.spin = true; g.add(h);
  } else if (type === 'mohawk') {
    for (let i = 0; i < 5; i++) {
      const m = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.3 - Math.abs(i - 2) * 0.05, 8), accM);
      m.position.set(0, 0.08, 0.24 - i * 0.12); m.rotation.x = -0.2 + i * 0.1; g.add(m);
    }
  }
  return g;
}

function buildWeapon(b) {
  const g = new THREE.Group();
  const tip = new THREE.Object3D();
  const ec = ELEM_COLOR[b.element];
  const headM = mat(b.wColor, { metalness: 0.55, roughness: 0.3, emissive: ec, emissiveIntensity: b.element === 'none' ? 0 : 0.3 });
  const gripLen = b.wHead === 'fist' ? 0 : b.gripLen;
  if (gripLen) {
    const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, gripLen, 10), mat(0x5a3b24));
    grip.position.y = gripLen / 2 - 0.15; g.add(grip);
  }
  const hy = gripLen - 0.15;
  // 先っぽは hd グループにまとめ、長さ・太さスライダーで拡大縮小する
  const outer = g;
  const hd = new THREE.Group(); hd.position.y = hy; outer.add(hd);
  {
    const L = b.bladeLen, W = b.bladeW, k = (L + W) / 2;
    const sc = { sword: [W, L, W], spear: [W, L, W], hammer: [L, W, W], axe: [W, L, L], orb: [k, k, k], fist: [k, k, k] }[b.wHead];
    hd.scale.set(...sc);
  }
  return finishWeapon(b, outer, hd, tip, headM, ec, gripLen);
}

function finishWeapon(b, outer, g, tip, headM, ec, gripLen) {
  const hy = 0;
  switch (b.wHead) {
    case 'sword': {
      const guard = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.06, 0.12), GOLD); guard.position.y = hy; g.add(guard);
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.0, 0.04), headM); blade.position.y = hy + 0.53; g.add(blade);
      const pt = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.16, 4), headM); pt.position.y = hy + 1.1; pt.rotation.y = Math.PI / 4; pt.scale.z = 0.3; g.add(pt);
      tip.position.y = hy + 1.1; break;
    }
    case 'hammer': {
      const h = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.38, 0.38), headM); h.position.y = hy + 0.17; g.add(h);
      tip.position.y = hy + 0.17; break;
    }
    case 'axe': {
      const blade = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.06, 24, 1, false, -Math.PI / 2, Math.PI), headM);
      blade.rotation.z = Math.PI / 2; blade.position.set(0, hy + 0.15, 0.04); g.add(blade);
      const spike = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 8), headM); spike.rotation.x = -Math.PI / 2; spike.position.set(0, hy + 0.15, -0.1); g.add(spike);
      tip.position.set(0, hy + 0.15, 0.42); break;
    }
    case 'spear': {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.025, 8, 16), GOLD); ring.rotation.x = Math.PI / 2; ring.position.y = hy; g.add(ring);
      const c = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.5, 12), headM); c.position.y = hy + 0.25; g.add(c);
      tip.position.y = hy + 0.5; break;
    }
    case 'orb': {
      const o = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 16),
        new THREE.MeshStandardMaterial({ color: b.wColor, emissive: b.element === 'none' ? b.wColor : ec, emissiveIntensity: 0.7, roughness: 0.2 }));
      o.position.y = hy + 0.22; g.add(o);
      for (let i = 0; i < 3; i++) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.24, 0.04), GOLD);
        const a = i / 3 * Math.PI * 2; p.position.set(Math.sin(a) * 0.14, hy + 0.08, Math.cos(a) * 0.14); p.rotation.set(Math.cos(a) * 0.5, 0, -Math.sin(a) * 0.5); g.add(p);
      }
      tip.position.y = hy + 0.22; break;
    }
    case 'fist': {
      const f = new THREE.Mesh(new THREE.SphereGeometry(0.27, 18, 14), headM); f.scale.set(1, 0.9, 1.15); f.position.y = 0.23; g.add(f);
      tip.position.y = 0.23; break;
    }
  }
  g.add(tip);
  return { group: outer, tip };
}

/* ---- 手書きキャラ：描いた絵を切り抜いて、厚紙のような立体にする ---- */
const drawCache = new Map();   // dataURL → { canvas, aspect } / null（空）
function processDrawing(url, src) {
  const W = src.width, H = src.height;
  const data = src.getContext('2d').getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (data[(y * W + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) { drawCache.set(url, null); return null; }
  const pad = 3; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
  const c = document.createElement('canvas'); c.width = x1 - x0 + 1; c.height = y1 - y0 + 1;
  c.getContext('2d').drawImage(src, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
  const info = { canvas: c, aspect: c.width / c.height };
  drawCache.set(url, info);
  return info;
}
function ensureDrawing(url) {
  if (!url || drawCache.has(url)) return Promise.resolve(drawCache.get(url));
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
      c.getContext('2d').drawImage(img, 0, 0);
      res(processDrawing(url, c));
    };
    img.onerror = () => { drawCache.set(url, null); res(null); };
    img.src = url;

function buildPaper(info) {
  let H = 1.9, W = H * info.aspect;
  if (W > 2.2) { W = 2.2; H = W / info.aspect; }
  const tex = new THREE.CanvasTexture(info.canvas); tex.colorSpace = THREE.SRGBColorSpace;
  const geo = new THREE.PlaneGeometry(W, H);
  const g = new THREE.Group();
  const mats = [];
  const LAYERS = 7, THICK = 0.14;
  for (let i = 0; i < LAYERS; i++) {
    const face = i === 0 || i === LAYERS - 1;
    const m = new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.85, color: face ? 0xffffff : 0x6a6a7a });
    const mesh = new THREE.Mesh(geo, m);
    mesh.position.set(0, H / 2, -THICK / 2 + i * THICK / (LAYERS - 1));
    mesh.castShadow = true;
    mesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.5 });

function buildCharacter(b) {
  const root = new THREE.Group();
  const inner = new THREE.Group(); inner.scale.setScalar(b.size); root.add(inner);
  const accM = mat(b.accent);
  const info = b.bodyMode === 'draw' ? drawCache.get(b.drawing) : null;
  if (info) return finishCharacter(b, root, inner, accM, info);
  const bodyM = mat(b.color);
  const footGeo = new THREE.SphereGeometry(0.2, 16, 12);
  const feet = [];
  for (const sx of [-1, 1]) {
    const f = new THREE.Mesh(footGeo, accM); f.scale.set(1, 0.7, 1.3); f.position.set(0.25 * sx, 0.14, 0.05); inner.add(f); feet.push(f);
  }
  const torso = new THREE.Group(); inner.add(torso);
  let body, top, halfW, bodyY, faceZ;
  switch (b.body) {
    case 'cube':   body = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.8), bodyM); bodyY = 0.75; top = 1.25; halfW = 0.5; faceZ = 0.41; break;
    case 'ball':   body = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 24), bodyM); bodyY = 0.85; top = 1.43; halfW = 0.6; faceZ = 0.5; break;
    case 'pillar': body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.2, 28), bodyM); bodyY = 0.85; top = 1.45; halfW = 0.45; faceZ = 0.44; break;
    default:       body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.62, 1.25, 28), bodyM); bodyY = 0.85; top = 1.47; halfW = 0.5; faceZ = 0.33; break;
  }
  body.position.y = bodyY; torso.add(body);
  let headTop;
  if (b.head === 'none') {
    addEyes(torso, top - 0.32, faceZ, b.eyes, b.accent);
    headTop = top;
  } else {
    const h = b.head === 'ball'
      ? new THREE.Mesh(new THREE.SphereGeometry(0.42, 28, 20), bodyM)
      : new THREE.Mesh(new THREE.BoxGeometry(0.74, 0.7, 0.7), bodyM);
    const hy = top + (b.head === 'ball' ? 0.36 : 0.35);
    h.position.y = hy; torso.add(h);
    addEyes(torso, hy + 0.02, b.head === 'ball' ? 0.36 : 0.36, b.eyes, b.accent);
    headTop = hy + (b.head === 'ball' ? 0.38 : 0.35);
  }

}

function finishCharacter(b, root, inner, accM, info, parts) {
  let feet, torso, hat, halfW, bodyY, headTop, mats, paper = null;
  if (info) {
    // 手書き：絵の板を胴体として使い、足や頭は作らない
    const pp = buildPaper(info);
    torso = new THREE.Group(); inner.add(torso);
    paper = pp.group; torso.add(paper);
    feet = [new THREE.Object3D(), new THREE.Object3D()];
    hat = new THREE.Group();
    halfW = Math.min(pp.W / 2, 0.75) * 0.85; bodyY = pp.H * 0.42; headTop = pp.H;
    mats = [...pp.mats, accM];

  // 腕（右手に武器）
  const armPivot = new THREE.Group();
  armPivot.position.set(-(halfW + 0.14), bodyY, paper ? 0.18 : 0.05);
  armPivot.userData.base = armPivot.position.clone();
  torso.add(armPivot);
  if (b.wHead !== 'fist') { const hand = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), accM); armPivot.add(hand); }
  const weapon = buildWeapon(b);
  armPivot.add(weapon.group);
  if (!paper) {
    const offHand = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), accM);
    offHand.position.set(halfW + 0.12, bodyY - 0.1, 0.05); torso.add(offHand);
  }

  shadowAll(armPivot);
  if (!paper) shadowAll(root);

  // バリア・スタン表示
  const shield = new THREE.Mesh(new THREE.SphereGeometry(1.1, 24, 16),
    new THREE.MeshBasicMaterial({ color: 0x7fe3ff, transparent: true, opacity: 0.28, depthWrite: false }));
  shield.position.y = 0.9; shield.visible = false; inner.add(shield);
  const guard = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.05, 6),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4, depthWrite: false }));
  guard.rotation.x = Math.PI / 2; guard.position.set(0, 0.85, 0.8); guard.visible = false; inner.add(guard);
  const stars = new THREE.Group(); stars.position.y = headTop + 0.25; stars.visible = false; inner.add(stars);
  for (let i = 0; i < 3; i++) {
    const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.09), new THREE.MeshBasicMaterial({ color: 0xffee33 }));
    const a = i / 3 * Math.PI * 2; s.position.set(Math.sin(a) * 0.4, 0, Math.cos(a) * 0.4); stars.add(s);
  }

  return { root, inner, torso, feet, armPivot, tip: weapon.tip, hat, mats, shield, guard, stars, paper, height: (headTop + 0.2) * b.size };
}

let AC = null;
function sfx(kind) {
  try {
    AC ??= new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const tone = (f1, f2, dur, type = 'square', vol = 0.12) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
    };
    const noise = (dur, vol = 0.2, hp = 800) => {
      const buf = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
      f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
      s.buffer = buf; s.connect(f).connect(g).connect(AC.destination); s.start(t);
    };
    switch (kind) {
      case 'swing': noise(0.12, 0.08, 2500); break;
      case 'hit': noise(0.15, 0.25, 400); tone(180, 60, 0.15, 'sine', 0.3); break;
      case 'big': noise(0.3, 0.35, 200); tone(120, 40, 0.3, 'sine', 0.4); break;
      case 'jump': tone(300, 700, 0.12, 'sine', 0.08); break;
      case 'skill': tone(400, 1200, 0.25, 'sawtooth', 0.07); break;
      case 'block': tone(1200, 900, 0.15, 'triangle', 0.15); break;
      case 'guard': tone(1500, 1350, 0.28, 'square', 0.07); tone(2250, 2000, 0.22, 'triangle', 0.09); tone(980, 900, 0.32, 'sine', 0.12); noise(0.05, 0.12, 4000); break;
      case 'tap': tone(1800, 1200, 0.04, 'square', 0.035); break;
      case 'shot': tone(900, 300, 0.15, 'square', 0.06); break;
      case 'ko': tone(600, 80, 0.8, 'sawtooth', 0.15); noise(0.6, 0.3, 150); break;
      case 'select': tone(660, 990, 0.06, 'square', 0.05); break;
      case 'shatter': noise(0.6, 0.45, 2500); noise(0.25, 0.3, 300); tone(2400, 500, 0.5, 'triangle', 0.08); break;
      case 'go': tone(523, 1046, 0.3, 'square', 0.08); break;
    }
  } catch { /* 音が出なくてもゲームは続行 */ }
}

const BINDS = [
  { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], atk: ['KeyF'], skl: ['KeyG'], jmp: ['KeyH', 'Space'], grd: ['KeyR', 'ShiftLeft'] },
  { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], atk: ['KeyK', 'Numpad1', 'Period'], skl: ['KeyL', 'Numpad2', 'Slash'], jmp: ['KeyI', 'Numpad0', 'Comma'], grd: ['KeyO', 'Numpad3', 'ShiftRight'] },
];
const padPrev = [{}, {}];
function readPad(i) {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const p = pads && pads[i];
  const out = { mx: 0, mz: 0, attack: false, skill: false, jump: false, guard: false };
  if (!p) return out;
  let ax = p.axes[0] || 0, ay = p.axes[1] || 0;
  if (Math.hypot(ax, ay) < 0.2) { ax = 0; ay = 0; }
  const b = n => !!(p.buttons[n] && p.buttons[n].pressed);
  if (b(14)) ax = -1; if (b(15)) ax = 1; if (b(12)) ay = -1; if (b(13)) ay = 1;
  out.mx = ax; out.mz = ay;
  const now = { a: b(0), x: b(2), s: b(1) || b(3) };
  out.guard = b(4) || b(5) || b(6) || b(7);
  out.attackHeld = now.x;
  out.jump = now.a && !padPrev[i].a; out.attack = now.x && !padPrev[i].x; out.skill = now.s && !padPrev[i].s;
  padPrev[i] = now;
  return out;
}

    layer.appendChild(pad);
    const stick = pad.querySelector('.stick'), knob = stick.querySelector('i');
    const home = () => {
      const w = pad.clientWidth, h = pad.clientHeight;
      const x = two && n === 1 ? w - 90 : 90;
      stick.style.left = x + 'px'; stick.style.top = (h - 100) + 'px';
      knob.style.transform = ''; stick.classList.add('idle');
    };
    home();
    let sid = null, ox = 0, oy = 0;
    pad.addEventListener('pointerdown', e => {
      const b = e.target.closest('.tb');
      if (b) {
        e.preventDefault();
        b.setPointerCapture?.(e.pointerId);   // 指がボタンの外にずれても離したときを拾う
        touchIn[pi][b.dataset.b] = true; b.classList.add('on');
        if (b.dataset.b === 'atk') touchIn[pi].atkHeld = true;
        // 押した手応え：沈む・光る・輪が広がる・カチッと鳴る・（対応機種は）ブルッと震える
        const rip = document.createElement('i'); rip.className = 'rip'; b.appendChild(rip); setTimeout(() => rip.remove(), 400);
        sfx('tap');
        try { navigator.vibrate?.(12); } catch { /* 振動できない端末 */ }

        const off = () => { b.classList.remove('on'); if (b.dataset.b === 'grd') touchIn[pi].grd = false; if (b.dataset.b === 'atk') touchIn[pi].atkHeld = false; };
        b.addEventListener('pointerup', off, { once: true }); b.addEventListener('pointercancel', off, { once: true });
        return;
      }
      if (sid !== null) return;
      sid = e.pointerId; pad.setPointerCapture(sid);
      const r = pad.getBoundingClientRect();

      stick.style.left = (ox - r.left) + 'px'; stick.style.top = (oy - r.top) + 'px';

      if (e.pointerId !== sid) return;

      const d = Math.hypot(dx, dy), max = 50;
      if (d > max) { dx = dx / d * max; dy = dy / d * max; }
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      const k = d < 8 ? 0 : 1;
      touchIn[pi].mx = dx / max * k; touchIn[pi].mz = dy / max * k;
    });
    const end = e => { if (e.pointerId !== sid) return; sid = null; touchIn[pi].mx = touchIn[pi].mz = 0; home(); };
    pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
  });
}

function readInput(i, alsoOther) {
  const sets = alsoOther ? [BINDS[0], BINDS[1]] : [BINDS[i]];
  const any = (list) => list.some(c => keys.has(c));
  const anyP = (list) => list.some(c => pressed.has(c));
  const r = readPad(i);
  const T = touchIn[i];
  r.mx += T.mx; r.mz += T.mz;
  r.attack ||= T.atk; r.skill ||= T.skl; r.jump ||= T.jmp; r.guard ||= T.grd; r.attackHeld ||= !!T.atkHeld;
  T.atk = T.skl = T.jmp = false;
  for (const B of sets) {
    r.mx += (any(B.right) ? 1 : 0) - (any(B.left) ? 1 : 0);
    r.mz += (any(B.down) ? 1 : 0) - (any(B.up) ? 1 : 0);
    r.attack ||= anyP(B.atk); r.skill ||= anyP(B.skl); r.jump ||= anyP(B.jmp); r.guard ||= any(B.grd); r.attackHeld ||= any(B.atk);
  }
  const l = Math.hypot(r.mx, r.mz); if (l > 1) { r.mx /= l; r.mz /= l; }
  return r;
}
