    parent.add(this.m.root);
    this.parent = parent;
    this.pos = new THREE.Vector3(); this.vel = new THREE.Vector3();
    if (parent === scene) {
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.75 * build.size, 0.95 * build.size, 32),
        new THREE.MeshBasicMaterial({ color: PCOLOR[idx], transparent: true, opacity: 0.85, depthWrite: false }));
      ring.rotation.x = -Math.PI / 2; scene.add(ring); this.ring = ring;
    }
    this.reset(0, 0);
  }
  reset(x, yaw) {
    this.pos.set(x, 0, 0); this.vel.set(0, 0, 0);
    this.yaw = this.targetYaw = yaw;
    this.hp = this.st.hp; this.lagHp = this.hp;
    this.state = 'idle'; this.atkT = 0; this.hitstun = 0; this.flash = 0;
    this.sp ??= 0;   // 必殺ゲージ（0〜1）。ラウンドをまたいで持ち越す
    this.status = { burn: 0, poison: 0, slow: 0, stun: 0, shield: 0 };
    this.gm = this.st.guardMax; this.gmDelay = 0; this.guarding = false;
    this.buf = { attack: 0, skill: 0, jump: 0, step: 0 }; this.chargeT = 0; this.charged = 0; this.guardLock = 0; this.blockStun = 0;
    this.chain = 0; this.hitLanded = false; this.orbHit = 0; this.combo = { hits: 0, dmg: 0, free: 0 };
    this.guardAge = 9; this.prevGuardIn = false; this.dodgeT = 0; this.dodgeCd = 0; this.invuln = 0;
    this.grounded = true; this.jumps = 0; this.dead = false; this.out = false; this.walk = 0;
    this.m.root.rotation.set(0, yaw, 0);
    this.ai = null;
  }
  dispose() { this.parent.remove(this.m.root); if (this.ring) scene.remove(this.ring); if (this.trail) { this.parent.remove(this.trail); this.trail.geometry.dispose(); this.trail.material.dispose(); } }
  get fwd() { return new THREE.Vector3(Math.sin(this.yaw), 0, Math.cos(this.yaw)); }
  center() { return new THREE.Vector3(this.pos.x, this.pos.y + 0.9 * this.b.size, this.pos.z); }

  update(dt, inp, opp) {
    const S = this.status, st = this.st;
    for (const k in S) S[k] = Math.max(0, S[k] - dt);
    this.hitstun = Math.max(0, this.hitstun - dt);
    this.flash = Math.max(0, this.flash - dt);
    this.orbHit = Math.max(0, this.orbHit - dt);
    if (this.pendingBreak) { this.pendingBreak = false; comboBreak(this, null, null); }
    if (this.hitstun <= 0 && S.stun <= 0) { this.combo.free += dt; if (this.combo.free > 0.3) { this.combo.hits = 0; this.combo.dmg = 0; } }
    if (this.sp >= 1 && !this.dead && G.phase === 'fight' && Math.random() < dt * 5) {
      burst(this.center().add(new THREE.Vector3((Math.random() - 0.5) * 1.2, -0.4, (Math.random() - 0.5) * 1.2)), 0xffd23f, 1, 1.2, 0.09, -4, 0.6);
    }
    if (!this.dead) {
      if (S.burn > 0) this.dot(ELEM_FX.burnDps * dt);
      if (S.poison > 0) this.dot(ELEM_FX.poisonDps * dt);
    }

    const control = !this.dead && this.hitstun <= 0 && S.stun <= 0 && G.phase === 'fight';
    if (!control && this.state === 'attack' && (this.hitstun > 0 || S.stun > 0)) this.state = 'idle';

    // 先行入力：押したボタンを少しだけ覚えておく
    const B = this.buf;
    for (const k in B) B[k] = Math.max(0, B[k] - dt);
    if (inp.attack) B.attack = BUFFER;
    if (inp.skill) B.skill = BUFFER;
    if (inp.jump) B.jump = BUFFER;
    this.atkHeld = !!inp.attackHeld;
    this.holdT = this.atkHeld ? (this.holdT || 0) + dt : 0;   // 攻撃ボタンを押し続けている時間
    this.stickDir = Math.hypot(inp.mx, inp.mz) > 0.3 ? Math.atan2(inp.mx, inp.mz) : null;

    if (this.state === 'attack') this.tickAttack(dt, opp);
    if (this.state === 'charge') this.tickCharge(dt, control);
    if (this.state === 'dash') this.tickDash(dt, opp);

    // 回避ステップ：ガードを押した瞬間に方向を入れていると、一瞬無敵のステップ（終わりに隙あり）
    const guardPress = inp.guard && !this.prevGuardIn;
    this.prevGuardIn = inp.guard;
    if (guardPress && Math.hypot(inp.mx, inp.mz) > 0.5) { B.step = BUFFER; this.stepIn = [inp.mx, inp.mz]; }
    this.dodgeCd = Math.max(0, this.dodgeCd - dt);
    this.guardLock = Math.max(0, this.guardLock - dt);
    this.blockStun = Math.max(0, this.blockStun - dt);
    this.invuln = Math.max(0, this.invuln - dt);
    if (control && B.step > 0 && this.grounded && this.state === 'idle' && this.dodgeCd <= 0 && this.guardLock <= 0 && !(this.blockStun > 0)) {
      const [sx, sz] = this.stepIn, l = Math.hypot(sx, sz);
      B.step = 0;
      this.state = 'dodge'; this.dodgeT = 0;
      this.dodgeDir = [sx / l, sz / l];
      this.invuln = DODGE.invEnd;
      sfx('jump');
    }
    if (this.state === 'dodge') {
      this.dodgeT += dt;
      const moving = this.dodgeT < DODGE.move;
      this.vel.x = moving ? this.dodgeDir[0] * DODGE.speed : this.vel.x * 0.7;
      this.vel.z = moving ? this.dodgeDir[1] * DODGE.speed : this.vel.z * 0.7;
      if (moving && Math.random() < 0.6) burst(this.center(), PCOLOR[this.idx], 1, 0.5, 0.2, 0, 0.25);
      if (this.dodgeT >= DODGE.total) { this.state = 'idle'; this.dodgeCd = DODGE.cooldown; }
    }

    // ガード：地上で何もしていない時に長押し。正面からの攻撃を軽減、ゲージが尽きるとブレイク
    //   ガードで受けた直後（blockStun）は、ボタンを離してもガードのまま
    const held = this.blockStun > 0;
    this.guarding = control && (inp.guard || held) && this.grounded && this.state === 'idle' && (held || (!inp.attack && !inp.skill)) && this.gm > 0 && this.guardLock <= 0;
    // ガードを押した瞬間から数える（ラウンド開始からずっと押していても正しく数える）
    this.guardAge = this.guarding ? (this.wasGuarding ? this.guardAge + dt : 0) : 0;
    if (this.wasGuarding && !this.guarding) this.guardEndLag = GUARD.releaseLag;   // ガード解除のスキ
    this.guardEndLag = Math.max(0, (this.guardEndLag || 0) - dt);
    this.wasGuarding = this.guarding;
    if (this.guarding) {
      this.gmDelay = 0.8;
      this.gm = Math.max(0, this.gm - GUARD_DRAIN * dt);   // 固まりすぎ防止
      if (opp && !opp.dead) this.targetYaw = Math.atan2(opp.pos.x - this.pos.x, opp.pos.z - this.pos.z);
    } else {
      this.gmDelay = Math.max(0, this.gmDelay - dt);
      if (this.gmDelay <= 0) this.gm = Math.min(st.guardMax, this.gm + 25 * dt);
    }

    if (control && this.state !== 'dash' && this.state !== 'dodge') {
      const sp = st.speed * (S.slow > 0 ? 0.55 : 1) * (this.state === 'attack' || this.state === 'charge' ? 0.3 : 1) * (this.guarding ? 0.35 : 1);
      const k = Math.min(1, (this.grounded ? 14 : 8) * dt);   // 空中でも左右に動きやすく（復帰しやすい）
      this.vel.x += (inp.mx * sp - this.vel.x) * k;
      this.vel.z += (inp.mz * sp - this.vel.z) * k;
      if (Math.hypot(inp.mx, inp.mz) > 0.15 && this.state !== 'attack' && !this.guarding) this.targetYaw = Math.atan2(inp.mx, inp.mz);
      if (B.jump > 0 && this.jumps < 2 && !this.guarding && this.state !== 'charge') {
        B.jump = 0;
        this.vel.y = st.jump * (this.jumps === 0 ? 1 : 0.88);
        this.jumps++; this.grounded = false; sfx('jump');
        burst(new THREE.Vector3(this.pos.x, this.pos.y + 0.1, this.pos.z), 0xffffff, 6, 3, 0.12, 2, 0.3);
      }
      if (B.attack > 0 && this.canChain()) { B.attack = 0; this.startAttack(0, this.chain + 1); }
      else if (B.attack > 0 && this.state === 'idle' && !(this.guardEndLag > 0) && !(this.blockStun > 0)) { B.attack = 0; this.startAttack(); }
      else if (this.state === 'idle' && this.atkHeld && this.holdT >= CHARGE.hold && !this.charged && this.grounded) this.startCharge();
      else if (B.skill > 0 && this.state === 'idle' && this.sp >= 1 && !(this.blockStun > 0)) { B.skill = 0; this.useSkill(opp); }
    } else if (this.state !== 'dash' && this.state !== 'dodge') {
      const fr = Math.min(1, (this.grounded ? 5 : KB.airDrag) * dt);
      this.vel.x -= this.vel.x * fr; this.vel.z -= this.vel.z * fr;
    }

    this.yaw = angleLerp(this.yaw, this.targetYaw, Math.min(1, dt * 14));
    this.vel.y -= 26 * dt;
    const prevY = this.pos.y;
    this.pos.addScaledVector(this.vel, dt);
    const r = Math.hypot(this.pos.x, this.pos.z);
    // 崖のぼり：ステージの端の少し下にいて、ステージの方へ向かっていれば自動で上がる
    if (!this.dead && r > ARENA_R - 0.2 && r < ARENA_R + 0.9 && this.pos.y < 0.2 && this.pos.y > -1.6 && this.vel.y <= 2 && this.hitstun <= 0) {
      const inward = -(this.vel.x * this.pos.x + this.vel.z * this.pos.z) / r;
      if (inward > 0.5) {
        const k = (ARENA_R - 0.6) / r;
        this.pos.set(this.pos.x * k, 0, this.pos.z * k);
        this.vel.set(this.vel.x * 0.3, 0, this.vel.z * 0.3);
        burst(new THREE.Vector3(this.pos.x, 0.1, this.pos.z), 0xffffff, 6, 3, 0.12, 2, 0.3);
        sfx('jump');
      }
    }
    if (r <= ARENA_R && this.pos.y <= 0 && prevY >= -0.3) {
      if (!this.grounded && this.vel.y < -8) burst(new THREE.Vector3(this.pos.x, 0.1, this.pos.z), 0xd8cff0, 6, 3, 0.15, 2, 0.3);
      this.pos.y = 0; if (this.vel.y < 0) this.vel.y = 0;
      this.grounded = true; this.jumps = 0;
    } else if (this.pos.y > 0.001 || r > ARENA_R) {
      this.grounded = false;
    }
    if (this.pos.y < -7 && !this.out) this.out = true;
    this.animate(dt);
  }

  dot(amount) {
    this.hp -= amount;
    if (this.hp <= 0 && !this.dead) { this.hp = 0; this.dead = true; this.vel.y = 8; }
  }

  // 攻撃：スティックを倒していればその方向に振る（自動で相手を狙わない）
  startAttack(charged = 0, chain = 0) {
    this.state = 'attack'; this.atkT = 0; this.hitDone = false; this.charged = charged; this.armorUsed = false;
    this.chain = charged ? 0 : chain; this.hitLanded = false; this.orbHit = 0;
    if (this.stickDir !== null) this.yaw = this.targetYaw = this.stickDir;
  }
  // 当たった直後なら次の段を出せる（ため攻撃は対象外、3段目まで）
  // 魔法玉：弾が当たってから ORB.chain 秒以内に押すと次の弾（3連射）
  canChain() {
    const w = this.st.weapon;
    if (w.type === 'orb') return this.orbHit > 0 && this.chain < w.chainSteps - 1 && (this.state === 'idle' || (this.state === 'attack' && this.atkT >= w.wind + w.active));
    return this.state === 'attack' && this.hitLanded && !this.charged && this.chain < w.chainSteps - 1 && this.atkT >= w.wind;
  }
  // 今の攻撃のタイミング（ため攻撃は振りが速く、終わりの隙が大きい）
  timing() {
    const w = this.st.weapon;
    return this.charged ? { wind: w.wind * CHARGE.wind, active: w.active, recover: w.recover * CHARGE.recover } : w;
  }
  startCharge() {
    this.state = 'charge'; this.chargeT = 0; this.fullShown = false;
    sfx('chargeStart');
  }
  tickCharge(dt, control) {
    this.chargeT += dt;
    if (this.stickDir !== null) this.targetYaw = this.stickDir;
    const lv = Math.min(1, this.chargeT / CHARGE.full);
    if (Math.random() < dt * (6 + lv * 20)) {
      const tp = this.m.tip.getWorldPosition(new THREE.Vector3());
      burst(tp, lv >= 1 ? 0xffffff : 0xffd23f, 1, 1.5, 0.08 + lv * 0.08, -2, 0.3);
    }
    if (lv >= 1 && !this.fullShown) { this.fullShown = true; sfx('chargeFull'); burst(this.center(), 0xffffff, 12, 4, 0.1, 0, 0.3); }
    if (!control) { this.state = 'idle'; return; }
    if (!this.atkHeld || this.chargeT >= CHARGE.max) {
      if (this.chargeT < CHARGE.min) { this.state = 'idle'; return; }
      this.startAttack(lv);
    }
  }

  tickAttack(dt, opp) {
    const w = { ...this.st.weapon, ...this.timing() };
    const before = this.atkT;
    this.atkT += dt;
    const t = this.atkT;
    if (before < w.wind && t >= w.wind) sfx(w.type === 'orb' ? 'shot' : 'swing');
    if (t >= w.wind && t < w.wind + w.active + 0.02) {
      if (w.type === 'orb') {
        if (!this.hitDone) {
          this.hitDone = true;
          // 同時に出せる弾は ORB.max 個まで（連射でハメられないように）
          if (G.projectiles.filter(p => p.owner === this && !p.skill).length < ORB.max) this.fireProjectile(false, this.charged);
        }
      } else {
        if (this.b.element !== 'none' || w.type === 'hammer') {
          const tp = this.m.tip.getWorldPosition(new THREE.Vector3());
          burst(tp, ELEM_COLOR[this.b.element], 2, 1.5, 0.1, 0, 0.25);
        }
        if (!this.hitDone && opp) this.tryHit(opp, w);
      }
    }
    // 振り終わってもボタンを押したままなら、ために入る（ため攻撃のあとは入らない）
    if (!this.charged && this.atkHeld && this.holdT >= CHARGE.hold && t >= w.wind + w.active) {
      this.startCharge();
      return;
    }
    if (t >= w.wind + w.active + w.recover) { this.state = 'idle'; this.charged = 0; }
  }

  tryHit(opp, w) {
    if (opp.dead) return;
    const dx = opp.pos.x - this.pos.x, dz = opp.pos.z - this.pos.z, dy = Math.abs(opp.pos.y - this.pos.y);
    const d = Math.hypot(dx, dz);
    if (d > w.reach + opp.st.radius * 0.6 || dy > 1.7 * Math.max(this.b.size, opp.b.size)) return;
    const f = this.fwd;
    const dot = (dx * f.x + dz * f.z) / Math.max(d, 0.001);
    if (dot > 0.25 || d < 0.9) {
      this.hitDone = true;
      const dir = new THREE.Vector3(dx, 0, dz).normalize();
      if (d < 0.01) dir.copy(f);
      const c = this.charged;
      let dmg, knock, chainStun = 0;
      if (c) { dmg = w.dmg * (1.4 + 0.6 * c); knock = w.knock * (1.3 + 0.4 * c); }
      else if (this.chain < w.chainSteps - 1) {
        // 途中の段：その場で止めて次の段につなげる
        dmg = w.chainDmg[this.chain]; knock = w.knock * COMBO.knock;
        chainStun = w.wind + w.active + COMBO.stunPad;
      } else { dmg = w.chainSteps === 1 ? w.dmg : w.chainDmg[this.chain]; knock = w.knock * (w.chainSteps === 1 ? 1 : COMBO.finKnock); }   // 最後の段：ふっとばす
      const res = applyHit(this, opp, dmg, knock, dir, this.b.element, 0, false, c > 0, chainStun);
      if (G.tut) {
        if (this.idx === 0 && res !== 'dodged') tutCount(c ? 'charge' : 'hit');
        if (this.idx === 1 && (res === 'guard' || res === 'just')) tutCount('guard');
      }
      if (res === undefined || res === 'armor') this.hitLanded = true;
      if (chainStun && res === undefined) { this.vel.x += f.x * 3; this.vel.z += f.z * 3; }   // 少し踏み込んで次の段を届かせる
      if (c) { G.shake = Math.max(G.shake, 0.25); }
    }
  }

  fireProjectile(big, charged = 0) {
    const f = this.fwd;
    const size = big ? 0.45 : this.st.weapon.projR * (charged ? 1.5 : 1);
    const color = this.b.element === 'none' ? new THREE.Color(this.b.wColor).getHex() : ELEM_COLOR[this.b.element];
    const m = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 12), new THREE.MeshBasicMaterial({ color }));
    const halo = new THREE.Mesh(new THREE.SphereGeometry(size * 1.6, 16, 12), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3, depthWrite: false }));
    m.add(halo);
    m.position.set(this.pos.x + f.x * 0.9, this.pos.y + 0.95 * this.b.size, this.pos.z + f.z * 0.9);
    scene.add(m);
    const w = this.st.weapon;
    G.projectiles.push({
      id: ++NET.seq, m, owner: this, vel: f.multiplyScalar(big ? 16 : w.projSpeed * ORB.speed), life: big ? 1.4 : 1.1, r: size,
      dmg: big ? 14 : w.dmg * (charged ? 1.4 + 0.6 * charged : 1), knock: big ? 11 : w.knock * (charged ? 1.3 + 0.4 * charged : 1),
      element: this.b.element, color, skill: big, breaker: charged > 0, chain: big || charged ? -1 : this.chain,
    });
  }

  useSkill(opp) {
    const sk = this.st.skill;
    this.sp = 0;
    if (G.tut && this.idx === 0) tutCount('skill');
    sfx('skill');
    const c = this.center();
    const aim = () => { if (this.stickDir !== null) this.yaw = this.targetYaw = this.stickDir; };
    switch (sk) {
      case 'dash': {
        aim(); this.state = 'dash'; this.dashT = 0.28; this.dashHit = false;
        const f = this.fwd; this.vel.set(f.x * 22, Math.max(this.vel.y, 1.5), f.z * 22);
        break;
      }
      case 'shot': aim(); this.fireProjectile(true); break;
      case 'shield': this.status.shield = 1.5; break;
      case 'heal': {
        const before = this.hp;
        this.hp = Math.min(this.st.hp, this.hp + 18);
        burst(c, 0x7dff9a, 18, 4, 0.14, -3, 0.8);
        dmgNumber(c.clone().setY(c.y + 1), '+' + Math.round(this.hp - before), '#7dff9a');
        break;
      }
      case 'quake': {
        ringFx(this.pos, 0xffb347, 3.5);
        burst(new THREE.Vector3(this.pos.x, 0.2, this.pos.z), 0xb8a77a, 20, 8, 0.2, 18, 0.6);
        G.shake = Math.max(G.shake, 0.35);
        if (opp && !opp.dead) {
          const dx = opp.pos.x - this.pos.x, dz = opp.pos.z - this.pos.z, d = Math.hypot(dx, dz);
          if (d < 3.6 && opp.pos.y - this.pos.y < 1.6) {
            const dir = new THREE.Vector3(dx, 0, dz).normalize();
            applyHit(this, opp, 13, 8, dir, this.b.element, 10, true);
          }
        }
        break;
      }
      case 'blink': {
        burst(c, 0xc084fc, 14, 5, 0.12, 0, 0.4);
        if (opp && !opp.dead) {
          const of = opp.fwd;
          let nx = opp.pos.x - of.x * 1.6, nz = opp.pos.z - of.z * 1.6;
          const r = Math.hypot(nx, nz);
          if (r > ARENA_R - 0.5) { nx *= (ARENA_R - 0.5) / r; nz *= (ARENA_R - 0.5) / r; }
          this.pos.set(nx, Math.max(0, opp.pos.y), nz);
          this.vel.set(0, 0, 0);
          this.yaw = this.targetYaw = Math.atan2(opp.pos.x - nx, opp.pos.z - nz);
          // 背後を取られた相手は一瞬ひるむ（ワープのあとの攻撃が入る）。無敵・バリア中は効かない
          // コンボのカウントは仕切り直し（ゲージは1発で4分の1までなので、3段コンボ→ワープの無限ループにはならない）
          if (opp.invuln <= 0 && !(opp.status.shield > 0)) {
            opp.hitstun = Math.max(opp.hitstun, BLINK_STUN); opp.state = 'idle'; opp.flash = 0.1;
            opp.combo.hits = 0; opp.combo.dmg = 0;
          }
        }
        this.invuln = 0.35;   // ワープ直後は一瞬無敵（無限ハメは必殺ゲージの上限とコンボ上限で防ぐ）
        burst(this.center(), 0xc084fc, 14, 5, 0.12, 0, 0.4);
        break;
      }
    }
  }

  tickDash(dt, opp) {
    this.dashT -= dt;
    burst(this.center(), PCOLOR[this.idx], 1, 1, 0.18, 0, 0.3);
    if (!this.dashHit && opp && !opp.dead) {
      const d = this.center().distanceTo(opp.center());
      if (d < 1.1 + opp.st.radius) {
        this.dashHit = true;
        applyHit(this, opp, 12, 13, this.fwd, this.b.element, 0, true);
        this.vel.multiplyScalar(0.2);
      }
    }
    if (this.dashT <= 0) { this.state = 'idle'; this.vel.x *= 0.3; this.vel.z *= 0.3; }
  }

  // 武器を振ったときの光の軌跡（剣先と手元の位置を数フレーム分つないだ帯）
  updateTrail(dt) {
    const w = { ...this.st.weapon, ...this.timing() };
    const swinging = this.state === 'attack' && w.type !== 'orb' && this.atkT >= w.wind * 0.6 && this.atkT <= w.wind + w.active + 0.06;
    const pts = this.trailPts ??= [];
    for (const p of pts) p.age += dt;
    if (swinging) {
      const tip = this.m.tip.getWorldPosition(new THREE.Vector3()), hand = this.m.armPivot.getWorldPosition(new THREE.Vector3());
      pts.push({ a: tip, b: hand.lerp(tip, 0.45), age: 0 });
    }
    while (pts.length && (pts[0].age > 0.12 || pts.length > 10)) pts.shift();
    if (!this.trail) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(10 * 2 * 3), 3));
      const idx = []; for (let i = 0; i < 9; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
      g.setIndex(idx);
      const col = this.b.element === 'none' ? 0xffffff : ELEM_COLOR[this.b.element];
      this.trail = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
      this.trail.frustumCulled = false;
      this.parent.add(this.trail);
    }
    const pos = this.trail.geometry.attributes.position;
    this.trail.visible = pts.length >= 2;
    if (!this.trail.visible) return;
    for (let i = 0; i < 10; i++) {
      const p = pts[Math.min(i, pts.length - 1)];
      pos.setXYZ(i * 2, p.a.x, p.a.y, p.a.z); pos.setXYZ(i * 2 + 1, p.b.x, p.b.y, p.b.z);
    }
    pos.needsUpdate = true;
    this.trail.geometry.setDrawRange(0, (pts.length - 1) * 6);
  }

  animate(dt) {
    const m = this.m, S = this.status;
    m.root.position.copy(this.pos);
    m.root.rotation.y = this.yaw;
    const hs = Math.hypot(this.vel.x, this.vel.z);
    // 歩き
    if (this.grounded && hs > 0.6) this.walk += dt * hs * 2.4; else this.walk *= 0.85;
    const sw = Math.sin(this.walk);
    m.feet[0].position.z = 0.05 + sw * 0.2; m.feet[1].position.z = 0.05 - sw * 0.2;
    m.feet[0].position.y = 0.14 + Math.max(0, sw) * 0.1; m.feet[1].position.y = 0.14 + Math.max(0, -sw) * 0.1;
    const t = performance.now() / 1000;
    m.torso.position.y = this.grounded ? Math.abs(Math.sin(this.walk)) * 0.07 + Math.sin(t * 3 + this.idx) * 0.02 : 0;
    let lean = this.grounded ? Math.min(hs * 0.03, 0.2) : -0.1;
    if (this.hitstun > 0) lean = -0.35;
    if (this.state === 'dash') lean = 0.5;
    if (this.state === 'charge') lean = -0.2;
    if (this.state === 'dodge') lean = this.dodgeT < DODGE.move ? 0.35 : -0.15;
    m.torso.rotation.x = THREE.MathUtils.lerp(m.torso.rotation.x, lean, Math.min(1, dt * 12));
    m.torso.rotation.z = m.paper ? Math.sin(this.walk) * 0.12 : 0;
    if (m.paper) m.paper.rotation.y = Math.atan2(camera.position.x - this.pos.x, camera.position.z - this.pos.z) - this.yaw - m.torso.rotation.y;
    if (this.dead) { m.inner.rotation.x += dt * 10; m.inner.rotation.z += dt * 6; } else { m.inner.rotation.set(0, 0, 0); }

    // 腕・武器
    const w = { ...this.st.weapon, ...this.timing() }, ap = m.armPivot, base = ap.userData.base;
    let rx = w.type === 'fist' || w.type === 'hand' ? 1.3 : 0.35, pz = 0, twist = 0, rz = 0;
    const diag = w.type === 'sword';   // 剣は右上から左下への斜め切り
    if (this.state === 'charge') {
      const lv = Math.min(1, this.chargeT / CHARGE.full), sh = lv >= 1 ? Math.sin(t * 60) * 0.04 : 0;
      if (w.style === 'thrust') { rx = Math.PI / 2; pz = -0.45 * lv; } else rx = -1.4 - 0.3 * lv + sh;
      twist = -0.35 * lv;
    } else if (this.state === 'attack') {
      const tt = this.atkT, a = w.wind, b2 = w.wind + w.active, c = b2 + w.recover;
      const ease = x => 1 - Math.pow(1 - x, 3);
      if (w.style === 'slash') {
        const D = diag ? 0.9 : 0;   // 斜め切り：振りかぶりで腕を外へ倒し、振り抜きで内へ
        if (tt < a) { rx = THREE.MathUtils.lerp(0.35, -1.4, ease(tt / a)); twist = -0.3 * (tt / a); rz = THREE.MathUtils.lerp(0, -D, ease(tt / a)); }
        else if (tt < b2) { const k = ease((tt - a) / w.active); rx = THREE.MathUtils.lerp(-1.4, 2.3, k); twist = 0.4 + 0.3 * (diag ? 1 : 0); rz = THREE.MathUtils.lerp(-D, D * 0.8, k); }
        else { const k = ease((tt - b2) / w.recover); rx = THREE.MathUtils.lerp(2.3, 0.35, k); twist = (0.4 + 0.3 * (diag ? 1 : 0)) * (1 - (tt - b2) / w.recover); rz = THREE.MathUtils.lerp(D * 0.8, 0, k); }
      } else if (w.style === 'thrust') {
        rx = Math.PI / 2;
        if (tt < a) pz = -0.3 * (tt / a);
        else if (tt < b2) pz = THREE.MathUtils.lerp(-0.3, 0.9, ease((tt - a) / w.active));
        else pz = THREE.MathUtils.lerp(0.9, 0, (tt - b2) / w.recover);
      } else {
        if (tt < a) rx = THREE.MathUtils.lerp(0.35, -0.6, tt / a);
        else rx = THREE.MathUtils.lerp(1.6, 0.35, Math.min(1, (tt - a) / (c - a)));
      }
    } else if (this.state === 'dash') rx = 1.4;
    else if (this.guarding) { rx = 1.0; twist = -0.25; }
    ap.rotation.x = rx;
    ap.rotation.order = 'ZYX';   // 先に前後に振り、その振りの面ごと z で斜めに倒す
    ap.rotation.z = rz;
    ap.position.z = base.z + pz;
    m.torso.rotation.y = twist;
    this.updateTrail(dt);

    // 状態の色
    let eh = 0x000000, ei = 0;
    const pulse = 0.5 + 0.5 * Math.sin(t * 20);
    if (this.flash > 0) { eh = 0xffffff; ei = 0.9; }
    else if (S.stun > 0) { eh = 0xffee33; ei = 0.5 * pulse; }
    else if (S.burn > 0) { eh = 0xff5a1f; ei = 0.6 * pulse; }
    else if (S.poison > 0) { eh = 0x7dff4a; ei = 0.4 * pulse; }
    else if (S.slow > 0) { eh = 0x66ddff; ei = 0.45; }
    if (this.invuln > 0 && this.flash <= 0) { eh = 0x9fd8ff; ei = 0.6; }
    if (this.st.weapon.armor && this.state === 'attack' && !this.charged && this.atkT < this.st.weapon.wind + this.st.weapon.active && this.flash <= 0) { eh = 0xff9a3d; ei = 0.35; }
    if (this.state === 'charge' && this.flash <= 0) { const lv = Math.min(1, this.chargeT / CHARGE.full); eh = lv >= 1 ? 0xffffff : 0xffb020; ei = 0.25 + 0.5 * lv * pulse; }
    for (const mm of m.mats) { mm.emissive.setHex(eh); mm.emissiveIntensity = ei; }
    m.shield.visible = S.shield > 0;
    m.guard.visible = this.guarding;
    this.guardFlash = Math.max(0, (this.guardFlash || 0) - dt);
    if (m.guard.visible) {
      const g = this.gm / this.st.guardMax;               // 減るほど小さく・赤く
      m.guard.scale.setScalar((0.45 + 0.55 * g) * (1 + this.guardFlash * 1.8));   // 受けた瞬間ぐっと大きく
      if (this.guardAge <= JUST_GUARD) m.guard.material.color.setHex(0xffd23f);   // ジャストガード受付中は金色
      else m.guard.material.color.setRGB(1, 0.35 + 0.65 * g, 0.35 + 0.65 * g);
      m.guard.material.opacity = Math.min(0.95, 0.3 + 0.25 * g + this.guardFlash * 3);
      if (this.guardFlash > 0) m.guard.material.color.setHex(0xffffff);
    }
    if (m.shield.visible) m.shield.scale.setScalar(1 + Math.sin(t * 15) * 0.04);
    // ため中は足元に光の輪（溜まるほど大きく、満タンで白く点滅）
    m.chargeRing.visible = this.state === 'charge';
    if (m.chargeRing.visible) {
      const lv = Math.min(1, this.chargeT / CHARGE.full);
      m.chargeRing.scale.setScalar(0.8 + 0.9 * lv + (lv >= 1 ? Math.sin(t * 30) * 0.06 : 0));
      m.chargeRing.material.color.setHex(lv >= 1 ? 0xffffff : 0xffd23f);
      m.chargeRing.material.opacity = 0.5 + 0.4 * lv;
      m.chargeRing.rotation.z += dt * 4;
    }
    m.stars.visible = S.stun > 0; m.stars.rotation.y += dt * 6;
    m.hat.traverse(o => { if (o.userData.spin) o.rotation.z += dt * 2; });
    if (S.burn > 0 && Math.random() < 0.3) burst(this.center(), 0xff7a1f, 1, 1.5, 0.12, -4, 0.4);
    if (S.poison > 0 && Math.random() < 0.15) burst(this.center(), 0x7dff4a, 1, 1, 0.1, -3, 0.5);

    if (this.ring) {
      const r = Math.hypot(this.pos.x, this.pos.z);
      this.ring.visible = r < ARENA_R && this.pos.y > -0.5 && !this.dead;
      this.ring.position.set(this.pos.x, 0.03, this.pos.z);
      const sc = 1 / (1 + Math.max(0, this.pos.y) * 0.15); this.ring.scale.setScalar(sc);
    }
  }
}

function applyHit(att, tgt, dmg, knock, dir, elem, lift = 0, bySkill = false, breaker = false, chainStun = 0, noFx = false) {
  if (tgt.dead || G.phase !== 'fight') return;
  const hitPos = tgt.center();
  if (tgt.invuln > 0) {   // 回避ステップの無敵中
    if (!tgt.dodgeShown) { dmgNumber(hitPos.clone().setY(hitPos.y + 0.8), 'よけた！', '#9fd8ff'); tgt.dodgeShown = true; setTimeout(() => tgt.dodgeShown = false, 400); }
    return 'dodged';
  }
  if (tgt.status.shield > 0) {
    sfx('block');
    burst(hitPos, 0x7fe3ff, 10, 5, 0.12, 0, 0.3);
    if (att) { att.vel.x -= dir.x * 9; att.vel.z -= dir.z * 9; att.hitstun = 0.25; att.state = 'idle'; }
    return 'shield';
  }
  // ガード：正面から受けた攻撃だけ防げる（背後や横からは通る）
  if (tgt.guarding && tgt.fwd.dot(dir) < -0.1) {
    // ジャストガード：ガードした直後に受けるとノーダメージ＆相手が止まる → 反撃のチャンス
    if (tgt.guardAge <= JUST_GUARD) {
      sfx('block'); sfx('go');
      G.hitstop = 0.12; G.shake = Math.max(G.shake, 0.15);
      burst(hitPos.clone().addScaledVector(dir, -0.6), 0xffffff, 16, 6, 0.12, 0, 0.35);
      burst(hitPos.clone().addScaledVector(dir, -0.6), 0xffd23f, 10, 4, 0.1, 0, 0.35);
      dmgNumber(hitPos.clone().setY(hitPos.y + 0.9), 'ジャストガード！', '#ffd23f');
      tgt.sp = Math.min(1, tgt.sp + 0.15);
      if (att) {
        att.status.stun = Math.max(att.status.stun, 0.45); att.state = 'idle';
        att.guardLock = JUST_LOCK;   // ジャストガードし返されないよう、少しの間ガード・ステップ不可
        const ap = att.center(); dmgNumber(ap.setY(ap.y + 1.1), 'スキあり！', '#ff8a3d');
      }
      return 'just';
    }
    // ガードしすぎは不利：ゲージが減るほど削りダメージと押し返しが大きくなる
    const worn = 1 - tgt.gm / tgt.st.guardMax;          // 0=元気 〜 1=限界
    const chip = dmg * (0.1 + 0.5 * worn) * tgt.st.def;
    tgt.hp = Math.max(1, tgt.hp - chip);
    tgt.gm -= breaker ? tgt.gm + 1 : dmg * GUARD.blockDrain;   // ため攻撃は一発でガードを割る
    const push = knock * 0.25 * (1 + 2 * worn);         // 端で固めていると場外に押し出される
    tgt.vel.x += dir.x * push; tgt.vel.z += dir.z * push;
    tgt.flash = 0.05;
    tgt.blockStun = Math.max(tgt.blockStun, dmg * FEEL.blockStun);
    if (att) { att.vel.x -= dir.x * 3; att.vel.z -= dir.z * 3; if (!bySkill) att.sp = Math.min(1, att.sp + Math.min(SP_HIT_CAP, dmg * GUARD.spOnBlock / SKILL_COST[att.st.skill])); }
    if (tgt.gm <= 0) {
      tgt.gm = 0; tgt.guarding = false; tgt.status.stun = 1.3; tgt.gmDelay = 1.5;
      sfx('big'); G.shake = Math.max(G.shake, 0.4);
      burst(hitPos, 0xffffff, 18, 8, 0.16, 6, 0.5);
      dmgNumber(hitPos.clone().setY(hitPos.y + 0.9), 'ガードブレイク！', '#ff6b6b');
    } else {
      // ガードの手応え：ビビン！と鳴り、盾が大きく光って波紋が広がり、少し止まって揺れる
      sfx('guard');
      const sp = hitPos.clone().addScaledVector(dir, -0.6);
      burst(sp, 0xffffff, 10, 6, 0.12, 0, 0.3);
      burst(sp, 0x9fd8ff, 14, 5, 0.1, 0, 0.35);
      guardRipple(tgt);
      tgt.guardFlash = 0.18;
      G.shake = Math.max(G.shake, 0.18);
      dmgNumber(hitPos.clone().setY(hitPos.y + 0.8), 'ガード！', '#9fd8ff');
    }
    G.hitstop = hitStopOf(dmg, FEEL.guardStop);
    return 'guard';
  }
  let dm = dmg * (elem === 'none' ? ELEM_FX.noneBonus : 1) * tgt.st.def;
  // コンボ上限：やられっぱなしの間に受けるダメージは合計 COMBO.cap まで
  const cb = tgt.combo;
  if (cb.hits > 0) {
    const left = COMBO.cap - cb.dmg;
    if (left <= 0.01) { comboBreak(tgt, att, dir); return 'break'; }
    dm = Math.min(dm, left);
  }
  cb.hits++; cb.dmg += dm; cb.free = 0;
  const comboOver = cb.hits > 1 && cb.dmg >= COMBO.cap - 0.01;
  tgt.hp -= dm;
  if (att && !bySkill) att.sp = Math.min(1, att.sp + Math.min(SP_HIT_CAP, dm / SKILL_COST[att.st.skill]));
  // 重さ負けしない：ハンマー・オノの振りかぶり中は、軽い武器（グローブ・ヤリ・魔法玉）の攻撃ではひるまない（ため攻撃中は除く）
  const tw = tgt.st.weapon;
  if (tw.armor && att && att.st.weapon.light && !bySkill && tgt.state === 'attack' && !tgt.charged && tgt.atkT < tw.wind + tw.active && tgt.hp > 0) {
    tgt.flash = 0.06; tgt.armorFx = 0.25;
    sfx('block');
    burst(hitPos, 0xffb347, 6, 4, 0.12, 0, 0.25);
    dmgNumber(hitPos.clone().setY(hitPos.y + 0.8), Math.round(dm), '#ffb347');
    G.hitstop = 0.04;
    return 'armor';
  }
  const ratio = 1 - Math.max(0, tgt.hp) / tgt.st.hp;
  const kb = knock * (KB.base + ratio * KB.grow) / tgt.st.knockRes * (elem === 'wind' ? ELEM_FX.windKnock : 1);
  tgt.vel.set(dir.x * kb, chainStun ? 0.5 : Math.min(KB.liftMax, 2 + kb * KB.lift) + lift, dir.z * kb);
  tgt.grounded = !!chainStun && tgt.grounded;
  tgt.jumps = Math.min(tgt.jumps, 1);   // 攻撃を受けたら空中ジャンプが1回分戻る（復帰のチャンス）
  tgt.hitstun = Math.max(0.15 + kb * 0.014, chainStun);
  tgt.state = 'idle';
  tgt.flash = 0.1;
  // noFx：属性のおまけ効果を付けない（魔法玉の3連射の途中の弾。重なると強すぎるため）
  const fx = noFx ? null : elem;
  if (fx === 'fire') tgt.status.burn = ELEM_FX.burn;
  if (fx === 'ice') tgt.status.slow = ELEM_FX.slow;
  if (fx === 'thunder') tgt.status.stun = Math.max(tgt.status.stun, tgt.hitstun + ELEM_FX.stun);   // 運要素なし：毎回少し長く止まる
  if (fx === 'poison') tgt.status.poison = ELEM_FX.poison;
  if (tgt.hp <= 0) {
    if (bySkill) {
      G.skillKO = true;
      const sp = hitPos.clone().project(camera);
      G.pendingShatter = { x: (sp.x + 1) / 2 * innerWidth, y: (1 - sp.y) / 2 * innerHeight };
      if (netRec()) NET.events.push(['shatter', (sp.x + 1) / 2, (1 - sp.y) / 2]);
    }
    tgt.hp = 0; tgt.dead = true;
    tgt.vel.x *= 1.8; tgt.vel.z *= 1.8; tgt.vel.y += 7;
    sfx('ko');
  }
  if (cb.hits >= 2 && !tgt.dead) dmgNumber(hitPos.clone().setY(hitPos.y + 1.4), `${cb.hits} HIT!`, '#ffd23f');
  if (comboOver && !tgt.dead) tgt.pendingBreak = true;   // この攻撃の処理が終わってからコンボ抜け
  const big = dm >= 14 || tgt.dead;
  sfx(big ? 'big' : 'hit');
  G.hitstop = tgt.dead ? 0.25 : hitStopOf(dm);
  G.shake = Math.max(G.shake, Math.min(0.7, dm * 0.03 + (tgt.dead ? 0.5 : 0)));
  burst(hitPos, ELEM_COLOR[elem], 8 + Math.round(dm), 7, 0.15, 10, 0.45);
  burst(hitPos, 0xffffff, 5, 9, 0.1, 0, 0.2);
  fxHit(hitPos, dir, elem, big || breaker);
  if (tgt.dead) { G.slowmo = 0.8; fxFlash(0.5); }   // KOの瞬間はスローモーション
  dmgNumber(hitPos.clone().setY(hitPos.y + 0.8), Math.round(dm), big ? '#ffd23f' : '#fff');
}

// コンボ抜け：上限まで受けたら、少しの間無敵になって仕切り直し
function comboBreak(tgt, att, dir) {
  if (tgt.dead) return;
  tgt.invuln = Math.max(tgt.invuln, COMBO.burstInvuln);
  tgt.combo.hits = 0; tgt.combo.dmg = 0;
  if (att && dir) { att.vel.x += dir.x * -6; att.vel.z += dir.z * -6; att.state = 'idle'; }
  burst(tgt.center(), 0x9fd8ff, 16, 6, 0.12, 0, 0.4);
  const p = tgt.center(); dmgNumber(p.setY(p.y + 1.2), 'コンボ抜け！', '#9fd8ff');
  sfx('block');
}

function updateProjectiles(dt) {
  for (let i = G.projectiles.length - 1; i >= 0; i--) {
    const p = G.projectiles[i];
    p.life -= dt;
    p.m.position.addScaledVector(p.vel, dt);
    if (Math.random() < 0.6) burst(p.m.position, p.color, 1, 0.5, p.r * 0.5, 0, 0.2);
    let gone = p.life <= 0;
    for (const f of G.fighters) {
      if (f === p.owner || f.dead || gone || f.invuln > 0) continue;
      if (p.m.position.distanceTo(f.center()) < p.r + f.st.radius + 0.15) {
        if (f.status.shield > 0) {
          p.owner = f; p.vel.multiplyScalar(-1.2); p.life = 1; sfx('block');
        } else {
          const o = p.owner, w = o.st.weapon;
          if (p.chain >= 0 && w.type === 'orb' && w.chainSteps > 1) {
            // 魔法玉の3連射：途中の弾は相手をその場に止め、次の弾が届くまで待たせる
            const mid = p.chain < w.chainSteps - 1;
            const travel = Math.hypot(f.pos.x - o.pos.x, f.pos.z - o.pos.z) / (w.projSpeed * ORB.speed);
            const res = applyHit(o, f, w.chainDmg[p.chain], w.knock * (mid ? COMBO.knock : COMBO.finKnock), p.vel.clone().setY(0).normalize(), p.element, 0, false, false,
                                 mid ? ORB.chain + w.wind + travel + COMBO.stunPad : 0, mid);   // 属性の効果は最後の1発だけ
            if (mid && res === undefined && o.chain === p.chain) o.orbHit = ORB.chain;
          } else applyHit(p.owner, f, p.dmg, p.knock, p.vel.clone().setY(0).normalize(), p.element, 0, p.skill, p.breaker);
          gone = true;
        }
      }
    }
    if (gone) { scene.remove(p.m); G.projectiles.splice(i, 1); }
  }
}

/* ---- 必殺で倒したときに画面が割れる ---- */
function shatterScreen(cx, cy) {
  let url;
  try { url = renderer.domElement.toDataURL('image/jpeg', 0.85); } catch { return; }
  const W = innerWidth, H = innerHeight;
  const L = shatterLayer; L.innerHTML = '';
  sfx('shatter');
  const flash = document.createElement('div'); flash.className = 'fl'; L.appendChild(flash);
  flash.animate([{ opacity: 0.9 }, { opacity: 0 }], { duration: 250, fill: 'forwards' });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { setTimeout(() => L.innerHTML = '', 400); return; }
  // ヒビの頂点：中心から放射状の線 × 同心円（隣り合うかけらで頂点を共有）
  const rays = 11, a0 = Math.random() * Math.PI * 2;
  const angs = Array.from({ length: rays }, (_, i) => a0 + (i + 0.25 + Math.random() * 0.5) / rays * Math.PI * 2);
  const radii = [0, 50 + Math.random() * 30, 170 + Math.random() * 80, Math.hypot(W, H) * 1.3];
  const V = radii.map((r, k) => angs.map(a => {
    const rr = k === 0 ? 0 : r * (k === 3 ? 1 : 0.8 + Math.random() * 0.4);
    return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr];
  }));
  const pieces = [];
  for (let k = 0; k < 3; k++) for (let i = 0; i < rays; i++) {
    const j = (i + 1) % rays;
    const poly = k === 0 ? [V[0][0], V[1][i], V[1][j]] : [V[k][i], V[k + 1][i], V[k + 1][j], V[k][j]];
    const pc = document.createElement('div'); pc.className = 'pc';
    pc.style.backgroundImage = `url(${url})`;
    pc.style.clipPath = `polygon(${poly.map(([x, y]) => `${x}px ${y}px`).join(',')})`;
    const gx = poly.reduce((a, p) => a + p[0], 0) / poly.length, gy = poly.reduce((a, p) => a + p[1], 0) / poly.length;
    pc.style.transformOrigin = `${gx}px ${gy}px`;
    L.appendChild(pc); pieces.push({ pc, gx, gy, k });
  }
  // ヒビの線
  const lines = [];
  angs.forEach((_, i) => lines.push(`M${V[0][0]} L${V[1][i]} L${V[2][i]} L${V[3][i]}`));
  for (const k of [1, 2]) lines.push('M' + V[k].map(p => p.join(' ')).join(' L') + ' Z');
  L.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 ${W} ${H}"><path d="${lines.join(' ')}" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="5"/><path d="${lines.join(' ')}" fill="none" stroke="#fff" stroke-width="2"/></svg>`);
  const svg = L.querySelector('svg');
  // 少しヒビを見せてから、かけらが飛び散って落ちる
  setTimeout(() => {
    svg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' });
    for (const { pc, gx, gy, k } of pieces) {
      const dx = gx - cx, dy = gy - cy, d = Math.hypot(dx, dy) || 1;
      const push = 60 + Math.random() * 140 + (2 - k) * 40;
      const tx = dx / d * push, ty = dy / d * push * 0.6 + 500 + Math.random() * 400;
      const rot = (Math.random() - 0.5) * 160;
      pc.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(.9)`, opacity: 0 },
      ], { duration: 900 + Math.random() * 500, delay: k * 40 + Math.random() * 80, easing: 'cubic-bezier(.45,0,.9,.55)', fill: 'forwards' });
    }
  }, 380);
  setTimeout(() => { if (L.firstChild) L.innerHTML = ''; }, 2200);
}

/* =========================================================
   CPU
   ========================================================= */
function cpuInput(f, o, dt) {
  const ai = f.ai ??= { t: 0, mx: 0, mz: 0, strafe: 1, atk: false, skl: false, jmp: false };
  const res = { mx: 0, mz: 0, attack: false, skill: false, jump: false, guard: false };
  const dx = o.pos.x - f.pos.x, dz = o.pos.z - f.pos.z, d = Math.hypot(dx, dz) || 0.01;
  const r = Math.hypot(f.pos.x, f.pos.z) || 0.01;
  if (G.tut && G.tut.step < TUTORIAL.length - 1) return tutDummyInput(f, o, dt);
  const w = f.st.weapon, L = CPU_LV[f.cpuLv ?? CPU_BASE_LV], k = f.boost || 0;
  // 場外からの復帰
  if (r > ARENA_R - 0.4 || (!f.grounded && r > ARENA_R - 2)) {
    res.mx = -f.pos.x / r; res.mz = -f.pos.z / r;
    res.jump = !f.grounded && f.vel.y < -1 && f.jumps < 2 && f.pos.y < 0.5;
    if (f.st.skill === 'blink' && f.sp >= 1 && f.pos.y < -1 && !o.dead) res.skill = true;
    if (f.st.skill === 'dash' && f.sp >= 1 && f.pos.y < -1) { f.yaw = f.targetYaw = Math.atan2(-f.pos.x, -f.pos.z); res.skill = true; }
    return res;
  }
  ai.t -= dt;
  if (ai.t <= 0 && !o.dead) {
    ai.t = (0.12 + Math.random() * 0.2) * L.think / (1 + ENDLESS_BOOST.think * k);
    ai.aimErr = L.aim ? (Math.random() * 2 - 1) * L.aim : 0;
    const want = w.type === 'orb' ? 5.5 : w.reach * 0.8;
    let mx = dx / d, mz = dz / d;
    if (w.type === 'orb' && d < want * 0.7) { mx = -mx; mz = -mz; }
    else if (d < want) {
      if (Math.random() < 0.3) ai.strafe *= -1;
      mx = -dz / d * ai.strafe * 0.5; mz = dx / d * ai.strafe * 0.5;
    }
    if (r > ARENA_R - 2.5) { mx = mx * 0.3 - f.pos.x / r; mz = mz * 0.3 - f.pos.z / r; }
    ai.mx = mx; ai.mz = mz;
    ai.atk = (w.type === 'orb' ? d < 11 : d < w.reach + 0.5) && Math.random() < L.atk;
    if (ai.atk && o.guarding && Math.random() < L.charge) ai.holdT = w.wind + w.active + 0.35 + Math.random() * 0.5;
    ai.jmp = (o.state === 'attack' && d < 3 && Math.random() < 0.25) || Math.random() < 0.02;
    if (o.state === 'attack' && d < o.st.weapon.reach + 1 && Math.random() < 0.2 * L.step) {
      const side = Math.random() < 0.5 ? 1 : -1;
      ai.stepDir = [-dz / d * side - dx / d * 0.5, dx / d * side - dz / d * 0.5]; ai.stepT = 0.06;
    } else if (o.state === 'attack' && d < o.st.weapon.reach + 1 && f.gm > f.st.guardMax * 0.3 && Math.random() < 0.45 * L.guard) {
      ai.guardT = 0.35 + Math.random() * 0.35; ai.atk = false; ai.jmp = false;
    }
    const hpR = f.hp / f.st.hp;
    const want2 = {
      heal: hpR < 0.5, shot: d > 4, dash: d > 2.5 && d < 9, quake: d < 3.2,
      blink: d > 4, shield: o.state === 'attack' && d < 3.5,
    }[f.st.skill];
    ai.skl = want2 && f.sp >= 1 && Math.random() < L.skill;
  }
  // 飛んでくる弾に反応：ガードするか、横に避ける
  if (!ai.projT || ai.projT <= 0) {
    for (const p of G.projectiles) {
      if (p.owner === f) continue;
      const px = f.pos.x - p.m.position.x, pz = f.pos.z - p.m.position.z, pd = Math.hypot(px, pz);
      const toward = (p.vel.x * px + p.vel.z * pz) / (Math.hypot(p.vel.x, p.vel.z) * pd || 1);
      if (pd < 6 && toward > 0.85) {
        ai.projT = 0.5;
        if (Math.random() > L.react) break;   // 人と同じく、いつも反応できるわけではない
        if (f.gm > f.st.guardMax * 0.3 && Math.random() < 0.5) ai.guardT = 0.45;
        else { const side = Math.random() < 0.5 ? 1 : -1; ai.dodge = [-pz / pd * side, px / pd * side]; ai.dodgeT = 0.35; }
        break;
      }
    }
  }
  ai.projT = (ai.projT || 0) - dt;
  // 上級CPU（おに）：相手の振りを見てジャストガード、空振りやしびれのスキには必ず反撃
  const parry = Math.min(ENDLESS_BOOST.parry[1], (L.parry || 0) + ENDLESS_BOOST.parry[0] * k), punish = L.punish || 0;
  if ((parry || punish) && !o.dead) {
    if (o.state === 'attack') {
      const ow = { ...o.st.weapon, ...o.timing() };
      if (ai.oAtkT === undefined || o.atkT < ai.oAtkT) { ai.parryGo = Math.random() < parry; ai.punishGo = Math.random() < punish; }   // 相手の攻撃1回ごとに決める
      ai.oAtkT = o.atkT;
      const until = ow.wind - o.atkT;   // あと何秒で当たり始めるか
      if (ai.parryGo && ow.type !== 'orb' && d < ow.reach + f.st.radius + 0.4 && until > 0 && until < JUST_GUARD * 0.6 && f.grounded && f.state === 'idle') {
        ai.guardT = ai.parryT = until + 0.12; ai.atk = false; ai.holdT = 0; ai.stepT = 0; ai.parryGo = false;
        f.yaw = f.targetYaw = Math.atan2(dx, dz);   // 正面で受けないとガードにならないので、すぐ相手の方を向く
      }
      const left = ow.wind + ow.active + ow.recover - o.atkT;   // 相手が動けるようになるまで
      if (ai.punishGo && o.atkT > ow.wind + ow.active && left > w.wind && d < w.reach + 0.4 && f.state === 'idle') { ai.atk = true; ai.guardT = 0; ai.punishGo = false; }
    } else ai.oAtkT = undefined;
    if (o.status.stun > 0.2) ai.parryT = 0;   // ジャストガードが決まって相手がしびれたら、受けの構えをやめて反撃へ
    // しびれている相手には反撃（ガードを解いた直後は少し攻撃できないので、出るまで押し続ける）
    if (o.status.stun > 0.05 && !ai.stunHit) { ai.stunHit = true; ai.stunGo = Math.random() < punish; }
    if (ai.stunGo && o.status.stun > 0.05 && d < w.reach + 0.6 && f.state === 'idle') { ai.atk = true; ai.guardT = 0; }
    if (!(o.status.stun > 0)) { ai.stunHit = false; ai.stunGo = false; }
    // 相打ちしない：相手の振りが先に当たるときは自分から振らずに受けを待つ。相手が振ってきても跳ばない
    if (parry && o.state === 'attack' && d < o.st.weapon.reach + 1.5) {
      const ow = { ...o.st.weapon, ...o.timing() };
      if (o.atkT < ow.wind && f.st.weapon.wind >= ow.wind - o.atkT) ai.atk = false;
      if (f.grounded) ai.jmp = false;
    }
  }
  res.mx = ai.mx; res.mz = ai.mz;
  if (ai.dodgeT > 0) { ai.dodgeT -= dt; res.mx = ai.dodge[0]; res.mz = ai.dodge[1]; }
  ai.guardT = Math.max(0, (ai.guardT || 0) - dt);
  res.guard = ai.guardT > 0;
  if (res.guard && !(ai.stepT > 0)) { res.mx = 0; res.mz = 0; }   // ガード中は止まる（勝手にステップしない）
  if (ai.stepT > 0) { ai.stepT -= dt; res.guard = true; res.mx = ai.stepDir[0]; res.mz = ai.stepDir[1]; }
  if (ai.parryT > 0) { ai.parryT -= dt; ai.atk = false; ai.skl = false; ai.jmp = false; ai.guardT = Math.max(ai.guardT, ai.parryT); res.guard = true; res.mx = res.mz = 0; }   // ジャストガードを狙っている間は他のことをしない
  else if (f.canChain() && ai.chainOK) { ai.atk = true; ai.chainOK = Math.random() < L.chain; }   // 当たったらコンボをつなぐ（弱いCPUはつながないことがある）
  const aimA = Math.atan2(dx, dz) + (ai.aimErr || 0);   // 弱いCPUは狙いが少しずれる
  if ((ai.atk || ai.skl) && !o.dead) f.yaw = f.targetYaw = aimA;   // CPUは相手の方を向いて振る
  if (ai.atk) { res.attack = true; ai.atk = false; if (!f.canChain()) ai.chainOK = Math.random() < L.chain; }
  ai.holdT = Math.max(0, (ai.holdT || 0) - dt);
  res.attackHeld = ai.holdT > 0;
  // 人と同じく「相手の方へスティックを倒して」攻撃する（自動狙いがないため）
  if ((res.attack || res.skill || res.attackHeld || ai.blinkFollow > 0) && !o.dead) { res.mx = Math.sin(aimA) * 0.6; res.mz = Math.cos(aimA) * 0.6; }
  if (ai.skl) { res.skill = true; ai.skl = false; if (f.st.skill === 'blink') ai.blinkFollow = 0.25; }
  if (ai.blinkFollow > 0) { ai.blinkFollow -= dt; if (ai.blinkFollow <= 0) res.attack = true; }   // ワープしたら背後から殴る
  if (ai.jmp) { res.jump = true; ai.jmp = false; }
  return res;
}

function updateHud(dt) {

// 初めて画面に出る物（ガードの盾・武器の軌跡・当たったときの演出など）は、出た瞬間に描画の準備が走って一瞬カクつく。
// 試合の前に、隠れている物も含めて全部まとめて準備しておく
function prewarm() {
  const role = NET.role, nE = effects.length, nP = particles.length, hidden = [];
  NET.role = null;   // 準備用の演出は相手に送らない
  try {
    for (const f of G.fighters) f.updateTrail(0);
    const p = new THREE.Vector3(0, -40, 0), d = new THREE.Vector3(1, 0, 0);
    for (const e of Object.keys(ELEM_COLOR)) fxHit(p, d, e, false);
    ringFx(p, 0xffffff); burst(p, 0xffffff, 1);
    scene.traverse(o => { if (!o.visible) { hidden.push(o); o.visible = true; } });
    renderer.compile?.(scene, camera);
  } catch (e) { console.warn('prewarm', e); }
  finally {
    NET.role = role;
    hidden.forEach(o => o.visible = false);
    effects.splice(nE).forEach(e => e.dispose());
    particles.splice(nP).forEach(q => scene.remove(q.m));
  }
}
// 今の試合の種類（分析用）
function matchMode() { return NET.role ? 'online' : G.tut ? 'tutorial' : G.endless ? 'endless' : G.watch ? 'watch' : !G.vsCPU ? '2p' : G.mode || 'cpu'; }
function startBattle() {
  clearTitleDemo();
  for (const f of G.fighters) f.dispose();
  for (const p of G.projectiles) scene.remove(p.m);
  G.projectiles = [];
  G.fighters = [new Fighter(G.builds[0], 0, G.watch), new Fighter(G.builds[1], 1, (G.vsCPU || G.watch) && !NET.role)];
  prewarm();
  if (G.streak < 0) G.streak = 0;
  if (G.vsCPU && !G.watch) G.fighters[1].cpuLv = G.endless ? endlessLv() : G.cpuLv;
  if (G.endless && G.streak >= ENDLESS_BOOST.from) applyBoost(G.fighters[1], G.streak - ENDLESS_BOOST.from + 1);
  G.matchT0 = performance.now();
  if (!G.watch) {
    const me = G.builds[NET.role ? NET.me : 0] || {};
    track('match_start', { mode: matchMode(), cpu_lv: G.vsCPU && !NET.role && !G.tut ? CPU_LV[G.fighters[1].cpuLv]?.name : null, streak: G.endless ? G.streak : null,
                           weapon: me.wHead, element: me.element, skill: me.skill, size: me.bsize });
  }
  G.need = G.endless || G.tut ? 1 : 2;   // 勝ち抜き・チュートリアルは1本勝負でテンポよく
  G.wins = [0, 0]; G.round = 1;
  buildHud();
  show('hud');
  buildTouch(G.watch ? [] : (G.vsCPU || IS_TOUCH) ? [0] : [0, 1]);
  mode = 'battle';
  camera.clearViewOffset();
  startRound();
}
function startRound() {
  $('roundStars').hidden = true;
  G.fighters[0].reset(-4, Math.PI / 2);
  G.fighters[1].reset(4, -Math.PI / 2);
  for (const p of G.projectiles) scene.remove(p.m);
  G.projectiles = [];
  G.phase = 'intro'; G.phaseT = 0; G.skillKO = false; G.pendingShatter = null;
  announce(G.endless ? `${G.streak + 1}人目` : 'ROUND ' + G.round, 1.1);
  if (G.endless) { const e = G.fighters[1]; toast(`VS ${G.builds[1].name}（CPU：${CPU_LV[e.cpuLv].name}${e.boost ? '+' + e.boost : ''}）`, 2200); }
  else if (G.round === 1 && !G.watch && !G.tut) toast(IS_TOUCH ? '攻撃長押し＝ため攻撃でガードを割る／ガード＋スティックで回避' : '攻撃長押し＝ため攻撃でガードを割る／ガード＋方向でステップ', 4500);
}

function updateBattle(dt) {
  if (announceTimer > 0) { announceTimer -= dt; if (announceTimer <= 0) announceEl.innerHTML = ''; }
  if (G.paused) return;
  if (G.hitstop > 0) { G.hitstop -= dt; updateCamera(dt, true); return; }
  G.phaseT += dt;
  if (G.phase === 'intro' && G.phaseT > 1.2) { G.phase = 'fight'; G.phaseT = 0; announce('FIGHT!', 0.7); sfx('go'); }

  const [a, b] = G.fighters;
  const inputs = G.fighters.map((f, i) => {
    if (G.phase !== 'fight') return NO_INPUT;
    if (f.cpu) return cpuInput(f, G.fighters[1 - i], dt);
    return NET.role === 'host' && i === 1 ? netTakeInput() : readInput(i, G.vsCPU);
  });
  // 同じ瞬間に振ったとき、先に処理した方の攻撃が当たって相手の攻撃が消える。いつも1Pが先だと1Pが有利になるので、毎フレーム順番を入れ替える
  G.tick = (G.tick || 0) + 1;
  if (G.tick % 2) { a.update(dt, inputs[0], b); b.update(dt, inputs[1], a); }
  else { b.update(dt, inputs[1], a); a.update(dt, inputs[0], b); }

  // 押し合い
  if (!a.dead && !b.dead) {
    const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz);
    const min = a.st.radius + b.st.radius;
    if (d < min && d > 0.001 && Math.abs(a.pos.y - b.pos.y) < 1.2) {
      const push = (min - d) / 2;
      a.pos.x -= dx / d * push; a.pos.z -= dz / d * push;
      b.pos.x += dx / d * push; b.pos.z += dz / d * push;
    }
  }
  updateProjectiles(dt);

  if (G.phase === 'fight') {
    const loser = G.fighters.findIndex(f => f.out || f.dead);
    if (loser >= 0 && G.tut && G.tut.step < TUTORIAL.length - 1) { tutReset(); }
    else if (loser >= 0) {
      const f = G.fighters[loser];
      G.wins[1 - loser]++;
      G.phase = 'end'; G.phaseT = 0;
      announce(f.out && !f.dead ? 'RING OUT!' : G.skillKO ? 'ひっさつKO！！' : 'KO！！', 1.8);
      roundStars(1 - loser, G.wins[1 - loser], G.need);
      if (f.out && !f.dead) sfx('ko');
    }
  } else if (G.phase === 'end' && G.phaseT > 2.4) {
    const champ = G.wins.findIndex(w => w >= G.need);
    if (champ >= 0) {
      G.phase = 'over';
      $('winName').textContent = G.fighters[champ].b.name;
      $('winName').style.color = champ ? '#3fa9ff' : '#ff4d6d';
      showResult(champ);
      show('result');
      if (NET.role === 'host') netSend({ t: 'over', champ, w: G.wins });
      mode = 'result';
      if (G.watch) setTimeout(() => { if (mode === 'result' && G.watch) { G.builds = [randomBuild(), randomBuild()]; startBattle(); } }, 3500);
    } else { G.round++; startRound(); }
  }
  if (G.tut) tutUpdate(dt);
  updateHud(dt);
  updateTouchCd();
  updateCamera(dt);
}

const LAND_ZOOM = 0.6;   // 横画面のカメラの近さ（小さいほど寄る）
function updateCamera(dt, frozen = false) {
  const live = G.fighters.filter(f => f.pos.y > -6);
  const list = live.length ? live : G.fighters;
  const mid = new THREE.Vector3();
  list.forEach(f => mid.add(f.pos)); mid.divideScalar(list.length);
  mid.y = Math.max(-2, Math.min(mid.y, 3));
  let spread = 0;
  if (G.fighters.length === 2) spread = G.fighters[0].pos.distanceTo(G.fighters[1].pos);
  spread = Math.min(spread, 18);
  //   横向きのスマホ（高さが低い横長）は画面が横に広いぶん遠くなりすぎるので、2人が収まる範囲で寄る（LAND_ZOOM 倍の距離）
  const zoom = innerHeight < 500 && camera.aspect > 1.3 ? LAND_ZOOM : 1;
  if (camera.aspect > 1) { const k = zoom < 1 ? 0.9 : 0.7; mid.x *= k; mid.z *= k; }   // 横長はステージの中心へ少し寄せる（寄っているときは弱めに。2人が端に寄らないように）
  if (!frozen) G.camMid.lerp(mid, Math.min(1, dt * 4));
  // 2人が横幅に収まる距離までカメラを引く（縦画面対策）
  const oy = (8.5 + spread * 0.4) * zoom, oz = (12 + spread * 0.55) * zoom;
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
  const fit = Math.max(1, (spread / 2 + 2.2) / tanH / Math.hypot(oy, oz));
  const target = new THREE.Vector3(G.camMid.x, G.camMid.y + oy * fit, G.camMid.z + oz * fit);
  camera.position.lerp(target, Math.min(1, dt * 3));
  if (G.shake > 0) {
    camera.position.x += (Math.random() - 0.5) * G.shake;
    camera.position.y += (Math.random() - 0.5) * G.shake;
    G.shake = Math.max(0, G.shake - dt * 2.5);
  }
  camera.lookAt(G.camMid.x, G.camMid.y + 0.8, G.camMid.z);
  // 横画面では HUD に隠れないよう、映す中心を少し下げる
  if (innerHeight < 500) camera.setViewOffset(innerWidth, innerHeight, 0, -innerHeight * 0.08, innerWidth, innerHeight);
  else if (camera.view?.enabled) camera.clearViewOffset();
}

function togglePause() {

  show(G.paused ? 'pause' : 'hud', true);
}

let titleT = 0;
function updateTitle(dt) {
  titleT += dt;
  for (const f of titleDemo) {
    if (f.state === 'attack') {
      f.atkT += dt;
      const w = f.st.weapon;
      if (f.atkT > w.wind + w.active + w.recover) f.state = 'idle';
    } else if (Math.random() < dt * 0.6) { f.state = 'attack'; f.atkT = 0; }
    f.animate(dt);
    if (f.ring) f.ring.visible = false;

  const fit = Math.max(1, 1.3 / camera.aspect);
  camera.position.set(Math.sin(titleT * 0.15) * 9 * fit, 4.5 * fit, Math.cos(titleT * 0.15) * 9 * fit);
  camera.lookAt(0, 1.2, 0);
}

const PAD_COLORS = ['#222222', '#ffffff', '#ff4d6d', '#ff9f1c', '#ffd23f', '#4ade80', '#3fa9ff', '#a78bfa', '#8b5a2b', '#f9c9a0'];
const pen = { color: '#222222', size: 10, erase: false };
let padUndo = [];

function setupPad() {
  const c = $('pad'), ctx = c.getContext('2d');
  ctx.lineCap = ctx.lineJoin = 'round';
  padUndo = [];
  loadPad();
  let down = false, last = null;
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * c.width, (e.clientY - r.top) / r.height * c.height]; };
  const line = (a, b) => {
    ctx.globalCompositeOperation = pen.erase ? 'destination-out' : 'source-over';
    ctx.strokeStyle = pen.color; ctx.lineWidth = pen.erase ? pen.size * 1.6 : pen.size;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0] + 0.01, b[1]); ctx.stroke();
  };
  c.addEventListener('pointerdown', e => {
    e.preventDefault(); c.setPointerCapture(e.pointerId);
    padUndo.push(ctx.getImageData(0, 0, c.width, c.height)); if (padUndo.length > 25) padUndo.shift();
    down = true; last = pos(e); line(last, last);
  });
  c.addEventListener('pointermove', e => { if (!down) return; const p = pos(e); line(last, p); last = p; });
  const end = () => { if (!down) return; down = false; commitPad(); };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  $('pal').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) { pen.color = b.dataset.c; pen.erase = false; syncPadTools(); } });
  $('penC').addEventListener('input', e => { pen.color = e.target.value; pen.erase = false; syncPadTools(); });
  document.querySelectorAll('[data-size]').forEach(b => b.onclick = () => { pen.size = +b.dataset.size; syncPadTools(); });
  $('eraser').onclick = () => { pen.erase = !pen.erase; syncPadTools(); };
  $('padUndo').onclick = () => { const d = padUndo.pop(); if (d) { ctx.putImageData(d, 0, 0); commitPad(); } };
  $('padClear').onclick = () => { padUndo.push(ctx.getImageData(0, 0, c.width, c.height)); ctx.clearRect(0, 0, c.width, c.height); commitPad(); };
  syncPadTools();
}
// 今のビルドの絵をキャンバスに描き直す（読み込み・おまかせの後など）
function loadPad() {
  const c = $('pad'); if (!c) return;
  const ctx = c.getContext('2d');
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, c.width, c.height);
  c.dataset.src = cur.drawing || '';
  if (cur.drawing) { const img = new Image(); img.onload = () => { if (c.dataset.src === cur.drawing) ctx.drawImage(img, 0, 0, c.width, c.height); }; img.src = cur.drawing; }
}
function syncPadTools() {
  document.querySelectorAll('#pal [data-c]').forEach(b => b.classList.toggle('sel', !pen.erase && b.dataset.c === pen.color));
  document.querySelectorAll('[data-size]').forEach(b => b.classList.toggle('sel', +b.dataset.size === pen.size));
  $('eraser').classList.toggle('sel', pen.erase);
}
function commitPad() {
  const c = $('pad');
  const url = c.toDataURL('image/png');
  cur.drawing = processDrawing(url, c) ? url : '';
  c.dataset.src = cur.drawing;
  refreshPreview();
}

const thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
thumbR.setPixelRatio(1); thumbR.setSize(128, 128); thumbR.outputColorSpace = THREE.SRGBColorSpace;
const tScene = new THREE.Scene();
tScene.add(new THREE.HemisphereLight(0xffffff, 0x5a4a8a, 1.6));
{ const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(3, 5, 6); tScene.add(d); }
const tCam = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
const SHARED_MATS = new Set([BLACK, WHITE, GOLD]);
const thumbCache = new Map();
const thumbQueue = [];
const LOOK_KEYS = ['color', 'accent', 'body', 'head', 'eyes', 'hat'];
const WEP_KEYS = ['wColor', 'element', 'gripLen', 'bladeLen', 'bladeW'];

function disposeObj(o) {
  o.traverse(m => {
    if (m.geometry) m.geometry.dispose();
    if (m.material && !SHARED_MATS.has(m.material)) m.material.dispose();
  });
}
function thumbId(key, v) {
  const deps = key === 'wHead' ? WEP_KEYS : LOOK_KEYS;
  return key + ':' + v + ':' + deps.map(k => cur[k]).join('|');
}
function drawThumb(key, v, b) {
  let obj, target = new THREE.Vector3(), dist;
  if (key === 'wHead') {
    obj = buildWeapon({ ...b, wHead: v }).group;
    obj.rotation.set(0, 0.6, -0.75);
    obj.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3());
    box.getCenter(target);
    dist = Math.max(size.x, size.y, size.z) * 2.1 + 0.3;
    tCam.position.set(target.x, target.y + dist * 0.15, target.z + dist);
  } else {
    const ch = buildCharacter({ ...b, [key]: v, size: 1, bodyMode: 'parts' });
    ch.armPivot.visible = false;
    obj = ch.root; obj.rotation.y = 0.45;
    const h = ch.height;
    if (key === 'body') { target.set(0, h * 0.5, 0); dist = h * 2.0 + 0.3; }
    else if (key === 'hat') { target.set(0, h * 0.8, 0); dist = h * 1.6 + 0.4; }
    else { target.set(0, h * 0.72, 0); dist = h * 1.25 + 0.4; }
    tCam.position.set(target.x + dist * 0.15, target.y + dist * 0.2, target.z + dist);
  }
  tCam.lookAt(target);
  tScene.add(obj);
  thumbR.render(tScene, tCam);
  const url = thumbR.domElement.toDataURL('image/png');
  tScene.remove(obj); disposeObj(obj);
  return url;
}
let thumbTimer = 0;
function refreshThumbs() {
  clearTimeout(thumbTimer);
  thumbTimer = setTimeout(() => {
    thumbQueue.length = 0;
    document.querySelectorAll('#panel img[data-thumb]').forEach(img => {
      const id = thumbId(img.dataset.thumb, img.dataset.tv);
      img.dataset.want = id;
      if (thumbCache.has(id)) img.src = thumbCache.get(id);
      else thumbQueue.push(img);
    });
    pumpThumbs();
  }, 120);
}
function pumpThumbs() {
  const t0 = performance.now();
  while (thumbQueue.length && performance.now() - t0 < 12) {
    const img = thumbQueue.shift();
    const id = img.dataset.want;
    if (!thumbCache.has(id)) {
      if (thumbCache.size > 400) thumbCache.clear();
      thumbCache.set(id, drawThumb(img.dataset.thumb, img.dataset.tv, cur));
    }
    if (img.dataset.want === id) img.src = thumbCache.get(id);
  }
  if (thumbQueue.length) setTimeout(pumpThumbs, 0);
}

function openModal(title, text, onOk) {

function sanitize(b) {
  const d = defaultBuild(0), out = { ...d };
  for (const k of Object.keys(OPTS)) if (OPTS[k].some(o => o[0] === b[k])) out[k] = b[k];
  for (const k of ['color', 'accent', 'wColor']) if (/^#[0-9a-f]{6}$/i.test(b[k])) out[k] = b[k];
  if (typeof b.name === 'string') out.name = b.name.slice(0, 10) || d.name;

  const num = (v, lo, hi, d) => (Number.isFinite(+v) && +v >= lo && +v <= hi) ? +v : d;
  out.gripLen = num(b.gripLen, 0, 1.4, b.wGrip === 'long' ? 1.1 : 0.55);
  out.bladeLen = num(b.bladeLen, 0.5, 1.8, 1);
  out.bladeW = num(b.bladeW, 0.5, 1.8, 1);
  out.bodyMode = DRAW_ON && b.bodyMode === 'draw' ? 'draw' : 'parts';
  out.drawing = (typeof b.drawing === 'string' && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(b.drawing) && b.drawing.length < 600000) ? b.drawing : '';
  out.size = 1;
  out.pts = defaultPts();
  if (b.pts && typeof b.pts === 'object') {
    const p = Object.fromEntries(PT_KEYS.map(([k]) => [k, Math.round(num(b.pts[k], PT_MIN, PT_MAX, 5))]));
    if (Object.values(p).reduce((a, c) => a + c, 0) <= PT_TOTAL) out.pts = p;
  }
  return out;
}

  w.querySelectorAll('.chip').forEach(c => c.onclick = e => {
    const list = loadRoster();

  });
}

function updatePreview(dt) {

  if (previewSwingT <= 0 && preview.state === 'idle') { preview.state = 'attack'; preview.atkT = 0; previewSwingT = 2.2; }
  if (preview.state === 'attack') {

  if (champ === 0) {
    G.streak++;
    const isNew = G.streak > rec;
    if (isNew) saveNum(LS_STREAK, G.streak);
    label.textContent = 'WIN!';
    $('winName').textContent = `${G.streak}連勝！`;
    sub.textContent = isNew && rec ? '🎉 自己ベスト更新中！' : `最高記録：${Math.max(rec, G.streak)}連勝`;
    again.textContent = 'つぎの相手へ ▶';
    $('remakeBtn').hidden = true;
  } else {
    label.textContent = 'GAME OVER';
    $('winName').textContent = `記録：${G.streak}連勝`;
    $('winName').style.color = '#ffd23f';
    sub.textContent = G.streak > 0 && G.streak >= rec ? '🎉 自己ベスト！' : rec ? `最高記録：${rec}連勝` : 'まずは1勝をめざそう！';
    again.textContent = 'もう一度挑戦';
    G.streak = -1;   // 「もう一度挑戦」で0から
  }
}

document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
  sfx('select');
  const go = b.dataset.go;
  G.mode = go;   // 分析用（cpu / quick / best など）
  track('menu_select', { item: go });
  G.watch = go === 'watch';
  G.endless = go === 'endless'; G.streak = 0;
  if (go === 'tutorial') { startTutorial(); return; }
  if (go === 'online') { openOnline(); return; }
  if (go === 'endless') { G.vsCPU = true; openCreator(0); return; }
  if (go === 'best') {
    const best = loadBest(); if (!best) return;
    G.vsCPU = true; G.builds = [best, randomBuild()];
    startBattle();
    return;
  }
  if (go === 'quick' || go === 'watch') {
    // スマホは1台で1人だけ操作する（おまかせはCPU戦にする）
    G.vsCPU = go === 'quick' && IS_TOUCH;
    G.builds = [randomBuild(), randomBuild()];
    startBattle();
    return;
  }
  G.vsCPU = go === 'cpu';
  openCreator(0);
});

$('okBtn').onclick = () => {
  sfx('go');
  if (!cur.name.trim()) cur.name = randName();
  if (NET.role) { netSubmitBuild(); return; }
  G.builds[createStep] = structuredClone(cur);
  if (preview) { preview.dispose(); preview = null; }
  if (G.vsCPU) {
    G.builds[1] = randomBuild();
    startBattle();
  } else if (createStep === 0) {
    openCreator(1);
  } else {
    startBattle();
  }
};
$('backBtn').onclick = () => {
  if (preview) { preview.dispose(); preview = null; }
  if (NET.role) { netClose(); goTitle(); return; }
  if (createStep === 1 && !G.vsCPU) { G.builds[1] = structuredClone(cur); openCreator(0); return; }
  goTitle();
};
$('againBtn').onclick = () => {
  sfx('go');
  if (NET.role) { NET.again[NET.me] = true; netSend({ t: 'again' }); $('againBtn').textContent = '相手を待っています…'; netTryRestart(); return; }
  if (G.tut) { const won = G.wins[0] > G.wins[1]; startTutorial(); if (!won) { G.tut.step = TUTORIAL.length - 1; G.fighters[1].b.name = 'よわいCPU'; buildHud(); tutShow(); } return; }
  if (G.vsCPU) G.builds[1] = randomBuild(); startBattle();
};
$('tutSkip').onclick = () => {
  if (G.tut) track('tutorial_skip', { step: G.tut.step });
  sfx('select');
  if (!G.tut) return;
  if (G.tut.step < TUTORIAL.length - 1) { G.tut.wait = 0.01; G.tut.step = TUTORIAL.length - 2; }   // 次で実戦へ
  else { endTutorial(); goTitle(); }
};
$('remakeBtn').onclick = () => { G.watch = false; cleanupBattle(); openCreator(0); };
$('toTitleBtn').onclick = () => { G.watch = false; G.endless = false; endTutorial(); netClose(); goTitle(); };
$('resumeBtn').onclick = togglePause;
$('btnLayoutBtn').onclick = () => { sfx('select'); openBtnEditor(() => buildTouch(touchPlayers)); };
// タイトル右上の設定
$('settingsBtn').onclick = () => {
  sfx('select');
  $('setBtnLayout').disabled = !IS_TOUCH;
  $('setNote').textContent = IS_TOUCH ? '縦画面と横画面で、別々に保存できます' : 'ボタンの配置は、スマホ・タブレットで変えられます';
  show('settings');
};
$('setBtnLayout').onclick = () => { sfx('select'); openBtnEditor(); };
$('setBack').onclick = () => { sfx('select'); show('title'); };
$('pauseBtn').onclick = () => { if (mode === 'battle' && !G.paused) togglePause(); };
$('quitBtn').onclick = () => { G.paused = false; G.watch = false; G.endless = false; endTutorial(); netClose(); goTitle(); };

function cleanupBattle() {
  buildTouch([]);
  for (const f of G.fighters) f.dispose();
  G.fighters = [];
  for (const p of G.projectiles) scene.remove(p.m);
  G.projectiles = [];
  for (const p of particles) scene.remove(p.m);
  particles.length = 0;
  for (const d of dmgNums) d.el.remove();
  dmgNums.length = 0;
  announceEl.innerHTML = '';
  $('roundStars').hidden = true;
}
function updateTitleBest() {
  const rec = loadNum(LS_STREAK, 0);
  const tutDone = loadNum(LS_TUT, 0);
  // チュートリアルがまだなら一番上に大きく出す。済んだら小さいタイル（練習）に
  $('tutMain').hidden = !!tutDone; $('tutGo').hidden = !tutDone;
  $('endlessRec').textContent = rec ? `最高 ${rec}連勝` : '';
  const best = loadBest();
  $('bestGo').hidden = !best;
  $('bestName').textContent = best ? best.name : '';
}
function goTitle() {
  updateTitleBest();
  cleanupBattle();
  if (preview) { preview.dispose(); preview = null; }
  camera.clearViewOffset();
  mode = 'title';
  show('title');
  setupTitleDemo();
}

/* =========================================================
   メインループ
   ========================================================= */
const clock = new THREE.Clock();
const QUALITY = { pr: renderer.getPixelRatio?.() ?? 1, sum: 0, n: 0 };
function autoQuality(raw) {
  if (mode !== 'battle' || G.paused || document.hidden || raw > 0.25) { QUALITY.sum = QUALITY.n = 0; return; }
  QUALITY.sum += raw; QUALITY.n++;
  if (QUALITY.sum < 2) return;
  const avg = QUALITY.sum / QUALITY.n; QUALITY.sum = QUALITY.n = 0;
  if (avg > 1 / 48 && QUALITY.pr > 1) { QUALITY.pr = Math.max(1, QUALITY.pr - 0.25); renderer.setPixelRatio(QUALITY.pr); renderer.setSize(innerWidth, innerHeight); }
}
function loop() {
  requestAnimationFrame(loop);
  const raw = clock.getDelta();
  autoQuality(raw);
  let dt = Math.min(raw, 1 / 30);
  if (G.slowmo > 0) { G.slowmo -= dt; dt *= 0.3; }   // KOの瞬間をゆっくり見せる
  const t = performance.now() / 1000;
  scene.children.forEach(o => { if (o.userData.bob !== undefined) o.position.y += Math.sin(t + o.userData.bob) * dt * 0.3; });
  if (mode === 'create') {
    updatePreview(dt);
    renderer.render(pScene, camera);
  } else {
    if (mode === 'title') updateTitle(dt);
    const stalled = netStalled();
    if ((mode === 'battle' || mode === 'result') && NET.role === 'guest') netGuestUpdate(dt);
    else if (stalled && NET.role === 'host') { updateCamera(dt); }
    else if (mode === 'battle' || mode === 'result') {
      if (mode === 'result') { G.fighters.forEach((f, i) => f.update(dt, NO_INPUT, G.fighters[1 - i])); updateCamera(dt); }
      else updateBattle(dt);
    }
    if (!G.paused) { updateParticles(dt); updateEffects(dt); updateDmgNums(dt); }
    if (NET.role === 'host' && (mode === 'battle' || mode === 'result')) netSendSnapshot();
    renderer.render(scene, camera);
    if (G.pendingShatter) { const p = G.pendingShatter; G.pendingShatter = null; shatterScreen(p.x, p.y); }
  }
  pressed.clear();
}
initAnalytics();
track('app_open');   // リテンション（何日後に戻ってきたか）はこのイベントで数える
setupTitleDemo();
updateTitleBest();
document.body.classList.add('ready');
loop();
if (location.hash === '#watch') document.querySelector('[data-go=watch]').click();
</script>
</body>
